
[workspace]
members = ["crates/*"]
default-members = ["crates/morphir"]
resolver = "3"

[workspace.package]
version = "0.4.0-alpha.6"
edition = "2024"
rust-version = "1.98"
authors = [
    "FINOS <info@finos.org>",
    "Damian Reeves <957246+DamianReeves@users.noreply.github.com>",
]
license = "Apache-2.0"
repository = "https://github.com/finos/morphir"
homepage = "https://github.com/finos/morphir"
documentation = "https://docs.rs/morphir"
keywords = ["morphir", "functional", "domain-modeling", "ir"]
categories = ["development-tools", "parsers"]

[workspace.dependencies]
# CLI framework
starbase = { version = "0.13", features = ["miette"] }
clap = { version = "4.5.57", features = ["derive", "color"] }
anyhow = "1.0"
base64 = "0.23"
cap-fs-ext = "3.4.5"
cap-std = "3.4.5"
same-file = "1.0.6"
thiserror = "2.0.18"
miette = { version = "7", features = ["fancy"] }
cucumber = "0.23"
vfs = "0.13"

# TUI
ratatui = "0.30"
crossterm = "0.29"
tuirealm = "4"
tui-realm-stdlib = "4"
tui-realm-textarea = "4"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
fs2 = "0.4"
rustix = { version = "1.1", features = ["fs"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "1", default-features = false, features = ["deserialize", "serialize"] }
stacker = "0.1"
toml = "1.0.0"
tempfile = "3"
semver = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
ed25519-dalek = "2"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
url = "2.5.8"
percent-encoding = "2.3.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
