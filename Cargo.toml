
[workspace]
members = ["crates/*"]
# A path dependency joins this workspace unless it is excluded, which is how a
# crate vendored inside the submodule ends up a member of the parent's
# workspace and subject to its lints. `ecosystem/morphir-rust` already excludes
# `morphir-package-tough` from its own workspace for that reason; the exclusion
# has to be repeated here because a workspace does not inherit another's.
# Without it, `cargo clippy -p morphir -- -D warnings` fails on upstream lints
# in vendored TUF code this repository does not own.
exclude = [
    "third_party/rust-tuf",
    "ecosystem/morphir-rust/third_party/morphir-package-tough",
]
default-members = ["crates/morphir"]
resolver = "3"

# Test-only fixture verification needs the already-adopted TUF 1.0.36 wire profile.
# Provenance and the single-version compatibility patch: third_party/rust-tuf/MORPHIR-VENDOR.md.
[patch.crates-io]
tuf = { path = "third_party/rust-tuf" }

[workspace.package]
version = "0.4.0-beta.7"
edition = "2024"
rust-version = "1.98"
authors = [
    "FINOS <info@finos.org>",
    "Damian Reeves <957246+DamianReeves@users.noreply.github.com>",
]
license = "Apache-2.0"
repository = "https://github.com/finos/morphir"
homepage = "https://github.com/finos/morphir"
documentation = "https://docs.rs/morphir"
keywords = ["morphir", "functional", "domain-modeling", "ir"]
categories = ["development-tools", "parsers"]

[workspace.dependencies]
# CLI framework
starbase = { version = "0.13", features = ["miette"] }
clap = { version = "4.5.57", features = ["derive", "color"] }
anyhow = "1.0"
base64 = "0.23"
cap-fs-ext = "4.0.0"
cap-std = "4.0.0"
same-file = "1.0.6"
thiserror = "2.0.18"
miette = { version = "7", features = ["fancy"] }
cucumber = "0.23"
vfs = "0.13"
shell-words = "1"
pulldown-cmark = { version = "0.13", default-features = false }
regorus = { version = "=0.12.0", default-features = false, features = ["std"] }
sha2 = "0.11"
# `morphir mck run --filter` uses Rust regex syntax (spec/mck/cli-contract.md)
regex = "1"
# Kit archives from github:finos/morphir (morphir-mck)
flate2 = "1"
tar = { version = "0.4", default-features = false }
# `mck kit vendor --source github:finos/morphir` (crates/morphir)
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"
tuirealm = "4"
tui-realm-stdlib = "4"
tui-realm-textarea = "4"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
fs2 = "0.4"
rustix = { version = "1.1", features = ["fs"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Offline draft MCK report validation; no HTTP or filesystem reference retrieval.
jsonschema = { version = "=0.26.2", default-features = false }
serde-saphyr = { version = "1", default-features = false, features = ["deserialize", "serialize"] }
# The IR YAML profile reader in `morphir-core` walks this parser's event stream. `morphir-core`
# takes it from the workspace, and a path dependency on it inherits from this root, so the pin
# lives here as well as in `ecosystem/morphir-rust/Cargo.toml` and is exact: the version the
# submodule's tests are written against is the version the CLI ships.
granit-parser = { version = "=1.2.0", default-features = false, features = ["std", "error_messages"] }
stacker = "0.1"
toml = "1.0.0"
tempfile = "3"
semver = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
ed25519-dalek = "3"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
url = "2.5.8"
percent-encoding = "2.3.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
