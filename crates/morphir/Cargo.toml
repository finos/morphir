[package]
name = "morphir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI for working with Morphir IR - functional domain modeling and business logic"

[lib]
name = "morphir"
path = "src/lib.rs"

[[bin]]
name = "morphir"
path = "src/main.rs"

[features]
# On by default so a normal build/test/clippy is unchanged; a contributor
# whose Visual Studio install lacks the "MSVC Spectre-mitigated libs"
# optional component builds with `--no-default-features` to skip `regorus`
# entirely and get everything except Rego evaluation (`morphir eval` and
# itest's Rego-backed assertions). See issue #886.
default = ["rego"]
rego = ["dep:morphir-opa"]

[dependencies]
starbase = { workspace = true }
clap = { workspace = true, features = ["color"] }
owo-colors = "4"
termimad = "0.35"
syntect = "5"
anyhow = { workspace = true }
base64 = { workspace = true }
cap-fs-ext = { workspace = true }
cap-std = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
morphir-core = { path = "../../ecosystem/morphir-rust/crates/morphir-core" }
morphir-decoration = { path = "../morphir-decoration" }
morphir-evaluator = { path = "../morphir-evaluator" }
# Pulls in `regorus`, which unconditionally enables `msvc_spectre_libs`'s
# `error` feature; that turns a missing "MSVC Spectre-mitigated libs" VS
# component into a build panic on Windows (see the `rego` feature below and
# https://github.com/finos/morphir/issues/886).
morphir-opa = { path = "../morphir-opa", optional = true }
morphir-mck = { path = "../morphir-mck" }
morphir-package = { path = "../../ecosystem/morphir-rust/crates/morphir-package" }
# `mck run --engine gherkin` runs the kit's `.feature` files through a `morphir_bdd::Suite`.
morphir-bdd = { path = "../../ecosystem/morphir-rust/crates/morphir-bdd" }
# `mck kit vendor --source github:finos/morphir` downloads one commit archive over HTTPS.
reqwest.workspace = true
# `mck run --filter` takes a Rust regular expression
regex.workspace = true
morphir-common = { path = "../../ecosystem/morphir-rust/crates/morphir-common" }
morphir-devkit = { path = "../../ecosystem/morphir-rust/crates/morphir-devkit" }
morphir-daemon = { path = "../../ecosystem/morphir-rust/crates/morphir-daemon" }
morphir-extension-sdk = { path = "../../ecosystem/morphir-rust/crates/morphir-extension-sdk" }
morphir-host = { path = "../../ecosystem/morphir-rust/crates/morphir-host" }
morphir-host-native = { path = "../../ecosystem/morphir-rust/crates/morphir-host-native" }
morphir-gleam-binding = { path = "../../ecosystem/morphir-rust/crates/morphir-gleam-binding" }
morphir-elm-binding = { path = "../../ecosystem/morphir-rust/crates/morphir-elm-binding" }
morphir-distribution = { path = "../../ecosystem/morphir-rust/crates/morphir-distribution" }
morphir-workspace = { path = "../../ecosystem/morphir-rust/crates/morphir-workspace" }
morphir-okf = { path = "../../ecosystem/morphir-rust/crates/morphir-okf" }
morphir-kb = { path = "../../ecosystem/morphir-rust/crates/morphir-kb" }
semver = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }
chrono = "0.4"
walkdir = "2"
shell-words = { workspace = true }
pulldown-cmark = { workspace = true }
fs2 = { workspace = true }
same-file = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
serde-saphyr = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
dirs = "7.0"
schemars = "1.0"
indexmap = { version = "2", features = ["serde"] }
getrandom = "0.4"
subtle = "2"
webbrowser = "1"
usage-lib = { version = "6", features = ["clap", "docs"] }
unicode-casefold = { workspace = true }
unicode-normalization = { workspace = true }

# TUI
ratatui = { workspace = true }
crossterm = { workspace = true }
tuirealm = { workspace = true }
tui-realm-stdlib = { workspace = true }
tui-realm-textarea = { workspace = true }

# Structured logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
morphir-runtime = { path = "../../ecosystem/morphir-rust/crates/morphir-runtime" }
jsonschema.workspace = true
cucumber = { workspace = true }
# `test-util` lets the playground provider's timeout test advance a virtual
# clock instead of waiting two real minutes.
tokio = { version = "1", features = ["test-util"] }
ed25519-dalek = { workspace = true }
futures-util = "0.3"
reqwest = { workspace = true, features = ["cookies", "json"] }
tokio-tungstenite = "0.30"

[build-dependencies]
chrono = "0.4"

# `mck run` end to end; the test binary doubles as a transcript-replay adapter.
[[test]]
name = "mck_run"
path = "tests/mck_run.rs"
harness = false

[[test]]
name = "mck_package"
path = "tests/mck_package.rs"
harness = false

[[test]]
name = "cli_integration"
path = "tests/cli_integration.rs"

[[test]]
name = "config_acceptance"
path = "tests/config_acceptance.rs"
harness = false

[[test]]
name = "kb_acceptance"
path = "tests/kb_acceptance.rs"
harness = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.{ archive-format }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
