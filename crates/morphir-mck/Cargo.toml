[package]
name = "morphir-mck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Morphir Compatibility Kit engine: kit parsing, loading, hashing and provenance"
# The build script embeds the IR kit. It reuses the crate's std-only kit
# syntax modules by path, so it needs no build-dependencies.
build = "build.rs"

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
indexmap = { version = "2", features = ["serde"] }
serde-saphyr.workspace = true
ion-rs = "1.0.1"
jsonschema.workspace = true
sha2.workspace = true
regex.workspace = true
similar.workspace = true
flate2.workspace = true
tar.workspace = true
unicode-normalization.workspace = true
url.workspace = true
chrono = "0.4"
semver = { workspace = true, features = ["serde"] }
base64.workspace = true
# The kit's `.feature` case files are read through the Morphir Gherkin model.
morphir-gherkin = { path = "../../ecosystem/morphir-rust/crates/morphir-gherkin" }
# The Gherkin engine runs the kit's `.feature` cases through the shared Morphir Gherkin suite
# runner and its `MorphirWorld`.
morphir-bdd = { path = "../../ecosystem/morphir-rust/crates/morphir-bdd" }
# The kit's own Gherkin step definitions use cucumber's step macros directly.
cucumber = { workspace = true }

# Adapter sessions terminate the adapter's whole process tree: a process group
# on Unix, a Job Object on Windows.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
ed25519-dalek.workspace = true
futures-executor = "0.3"
futures-util = { version = "0.3", features = ["io"] }
tuf = { version = "=0.3.0-beta9", default-features = false }
ring = "0.17"
# The BDD link test's `main` runs a `Suite` in a Tokio runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Adapter sessions against real processes; the test binary plays each adapter.
[[test]]
name = "transport"
path = "tests/transport.rs"
harness = false

# Proves cucumber-rs's `inventory` step collection links across the finos/morphir and
# morphir-rust workspace boundary (Task B0's spike). See tests/bdd_link.rs.
[[test]]
name = "bdd_link"
path = "tests/bdd_link.rs"
harness = false

# The kit step library runs a `.feature` kit through a `Suite` with a fake adapter.
[[test]]
name = "kit_steps"
path = "tests/kit_steps.rs"
harness = false
