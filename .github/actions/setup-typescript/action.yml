name: Set up checked TypeScript runtimes
description: Install pinned Bun and frozen root dependencies, then emit portable JavaScript
inputs:
  build-runtimes:
    description: Emit runtime JavaScript for jobs that execute it
    default: 'true'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.4'
    - name: Install tooling dependencies
      shell: bash
      run: bun install --frozen-lockfile
    - name: Build runtime JavaScript
      if: inputs.build-runtimes == 'true'
      shell: bash
      run: bun run build:runtimes
