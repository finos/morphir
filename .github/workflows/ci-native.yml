name: Native qualification

on:
  workflow_call:
    inputs:
      runner:
        description: Qualified native runner label
        required: true
        type: string
      acceptance-lanes:
        description: JSON array of compiler, frontend and conformance lanes
        type: string
        default: '[]'
      provider:
        description: Qualify installed signed providers
        type: boolean
        default: false
      full:
        description: Include the full workspace native release build
        type: boolean
        default: false

# Build CLI artifacts on Linux; execute acceptance on each qualified target OS.
# Keep fresh fixture/trust state and same-run artifact admission.
jobs:
  native-cli:
    name: Native CLI artifact (${{ inputs.runner }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript
      - name: Set up cached MoonBit and Zig
        uses: ./.github/actions/setup-moonbit
        with:
          tools: http:moonbit zig

      - name: Resolve pinned workspace packages
        run: moon update
      - name: Test artifact admission
        run: moon run scripts/ci-artifact.mbtx --self-test
      - name: Test cross-compiler wrappers
        run: moonx scripts/ci-native-build.mbtx --self-test
      - name: Cross-build the native CLI release
        env:
          CI_NATIVE_TARGET: ${{ inputs.runner == 'macos-15' && 'darwin-arm64' || 'linux-x64' }}
        run: mise run build:ci-native -- "$CI_NATIVE_TARGET"
      - name: Catalog native executable and build provenance
        env:
          CI_NATIVE_TARGET: ${{ inputs.runner == 'macos-15' && 'darwin-arm64' || 'linux-x64' }}
        run: moon run scripts/ci-artifact.mbtx pack-cross native-cli .dev/ci/native "$CI_NATIVE_TARGET"
      - name: Publish native executable immediately
        uses: actions/upload-artifact@v7
        with:
          name: ci-native-${{ inputs.runner }}
          path: |
            .dev/ci/native/morphir-native
            .dev/ci/native/manifest.ionb
          if-no-files-found: error
          overwrite: true

  native-workspace:
    name: Native workspace release
    runs-on: ubuntu-24.04
    if: inputs.full && inputs.runner == 'ubuntu-24.04'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-moonbit
      - run: moon update
      # Preserve the full workspace/default-compiler release check off the artifact path.
      - run: moon build --target native --release

  mep-process:
    name: Native MEP process (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-moonbit
      - run: moon update
      - name: Qualify the native MoonBit MEP backend process
        run: mise run test:mep-process
      - name: Retain MEP process qualification receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mep-process-${{ inputs.runner }}
          path: .dev/mep-process/
          if-no-files-found: warn

  native-cli-acceptance:
    name: Native CLI acceptance
    runs-on: ubuntu-24.04
    needs: native-cli
    if: inputs.runner == 'ubuntu-24.04'
    timeout-minutes: 30
    env:
      MORPHIR_CI_NATIVE: ${{ github.workspace }}/.dev/ci/native
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript
      - name: Set up cached MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Resolve pinned workspace packages
        run: moon update
      - name: Download this run's Linux native executable
        uses: actions/download-artifact@v8
        with:
          name: ci-native-ubuntu-24.04
          path: .dev/ci/native
      - name: Admit native executable
        run: moon run scripts/ci-artifact.mbtx verify native-cli "$MORPHIR_CI_NATIVE"
      - name: Smoke-test admitted native CLI without rebuilding
        run: bun run --cwd apps/morphir test native
      - name: Test acquisition without a MoonBit installation
        run: node apps/morphir/scripts/test-acquisition.ts "$MORPHIR_CI_NATIVE/morphir-native"

  native-acceptance:
    name: Native acceptance (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    if: inputs.runner == 'ubuntu-24.04' && inputs.acceptance-lanes != '[]'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.acceptance-lanes) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript
      - name: Set up cached MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Resolve pinned workspace packages
        run: moon update
      # Native workers and workspace grants have separate selected jobs.
      - name: Compile generated libraries and verify private build lifecycle
        if: matrix.lane == 'compiler'
        run: moonx scripts/typescript-tooling.mbtx test-compiler

      - name: Compare original MoonBit source and lowered Boolean libraries
        if: matrix.lane == 'frontend'
        env:
          MORPHIR_FRONTEND_RECEIPTS: .dev/frontend-ci
        run: mise run test:moonbit-frontend

      - name: Retain Boolean frontend acceptance identities
        if: always() && matrix.lane == 'frontend'
        uses: actions/upload-artifact@v7
        with:
          name: moonbit-frontend-native
          path: .dev/frontend-ci/
          if-no-files-found: error

      - name: Independent semantic conformance and evaluator codec
        if: matrix.lane == 'conformance'
        env:
          MORPHIR_CONFORMANCE_RECEIPTS: .dev/conformance-ci
        run: mise run test:conformance

      - name: Retain separate evaluator coverage receipts
        if: always() && matrix.lane == 'conformance'
        uses: actions/upload-artifact@v7
        with:
          name: conformance-native
          path: .dev/conformance-ci/
          if-no-files-found: warn

  provider-tools:
    if: inputs.provider
    permissions:
      contents: read
      attestations: read
    name: Provider tools artifact (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      MORPHIR_CI_PROVIDER_TOOLS: .dev/ci/provider-tools
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript
      - name: Set up cached MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Resolve pinned workspace packages
        run: moon update
      - name: Test release admission
        run: moon run scripts/ci-provider-release.mbtx --self-test
      - name: Acquire pinned and attested released provider tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: moon run scripts/ci-provider-release.mbtx
      - name: Publish provider tools
        uses: actions/upload-artifact@v7
        with:
          name: ci-provider-tools-${{ inputs.runner }}
          path: |
            .dev/ci/provider-tools/morphir-provider-snapshot
            .dev/ci/provider-tools/provider-snapshot-fixture
            .dev/ci/provider-tools/manifest.ionb
            .dev/ci/provider-tools/release-admission.ionb
          if-no-files-found: error
          overwrite: true

  installed-provider:
    if: inputs.provider
    name: Installed signed provider (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    needs: [native-cli, provider-tools]
    timeout-minutes: 60
    env:
      MORPHIR_CI_NATIVE: ${{ github.workspace }}/.dev/ci/native
      MORPHIR_CI_PROVIDER_TOOLS: ${{ github.workspace }}/.dev/ci/provider-tools
      MORPHIR_PROVIDER_RECEIPTS: .dev/installed-provider-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript
      - name: Set up cached MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Resolve pinned workspace packages
        run: moon update
      - name: Download this run's native executable
        uses: actions/download-artifact@v8
        with:
          name: ci-native-${{ inputs.runner }}
          path: .dev/ci/native
      - name: Download this run's provider tools
        uses: actions/download-artifact@v8
        with:
          name: ci-provider-tools-${{ inputs.runner }}
          path: .dev/ci/provider-tools
      - name: Qualify installed npm and native clients with fresh signed fixtures
        run: mise run test:installed-provider
      - name: Retain exact installed identities, timings and admission evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-provider-${{ inputs.runner }}
          path: .dev/installed-provider-ci/
          if-no-files-found: error

  native-ok:
    name: native-ok (${{ inputs.runner }})
    runs-on: ubuntu-latest
    if: always()
    needs: [native-cli, native-workspace, mep-process, native-cli-acceptance, native-acceptance, provider-tools, installed-provider]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-moonbit
      - name: Update Mooncakes registry for pinned gate dependencies
        run: moon update
      - name: Require selected native producers and consumers
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_INPUTS: ${{ toJSON(inputs) }}
        run: moonx scripts/ci-gate.mbtx --native
