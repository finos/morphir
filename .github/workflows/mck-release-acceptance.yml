name: Published MCK release acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published native CLI tag containing this acceptance harness'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Published MCK (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the published source tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # Keep qualification tooling repairable without modifying a published tag.
      # Cargo and Git commands below still run in the tagged source checkout.
      - name: Check out qualification tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .dev/acceptance-tools
          sparse-checkout: tools
          persist-credentials: false

      - name: Configure Windows Git paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install preparation runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare published CLI, exact-commit kit and native harness
        timeout-minutes: 35
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: node .dev/acceptance-tools/tools/mck-release-acceptance.mjs

      # Preparation exports MCK_TEST_EXE, MORPHIR_MCK_INSTALLED_CLI,
      # MORPHIR_MCK_PREACQUIRED_KIT and MORPHIR_MCK_REQUIRE_NETWORK_DENIAL.
      # Each runtime executes only the precompiled native test and its copied
      # CLI/replay adapter. An explicit TCP probe must fail under isolation.
      - name: Accept without networking on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          sudo env \
            MORPHIR_MCK_INSTALLED_CLI="$MORPHIR_MCK_INSTALLED_CLI" \
            MORPHIR_MCK_PREACQUIRED_KIT="$MORPHIR_MCK_PREACQUIRED_KIT" \
            MORPHIR_MCK_REQUIRE_NETWORK_DENIAL="$MORPHIR_MCK_REQUIRE_NETWORK_DENIAL" \
            MORPHIR_MCK_ACCEPTANCE_EVIDENCE="$MORPHIR_MCK_ACCEPTANCE_EVIDENCE" \
            timeout 300s unshare --net "$MCK_TEST_EXE" \
            installed_cli_runs_vendored_kit_without_tool_runtimes \
            2>&1 | tee .dev/out/mck-release-acceptance/offline.log

      - name: Accept without networking on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' \
            "$MCK_TEST_EXE" installed_cli_runs_vendored_kit_without_tool_runtimes \
            2>&1 | tee .dev/out/mck-release-acceptance/offline.log

      # Never use this firewall rule on a persistent or self-hosted machine.
      # Rule removal runs locally even while the Actions service is unreachable.
      - name: Accept without networking on disposable Windows runner
        if: runner.os == 'Windows'
        timeout-minutes: 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Firewall acceptance requires a disposable GitHub-hosted runner'
          }
          $rule = "MorphirMckAcceptance-$([guid]::NewGuid())"
          $process = $null
          try {
            New-NetFirewallRule -Name $rule -DisplayName $rule -Direction Outbound -Action Block -Profile Any -Enabled True | Out-Null
            $process = Start-Process -FilePath $env:MCK_TEST_EXE `
              -ArgumentList 'installed_cli_runs_vendored_kit_without_tool_runtimes' `
              -RedirectStandardOutput '.dev/out/mck-release-acceptance/offline.log' `
              -RedirectStandardError '.dev/out/mck-release-acceptance/offline-stderr.log' -PassThru
            if (-not $process.WaitForExit(300000)) {
              taskkill /PID $process.Id /T /F
              throw 'Native acceptance exceeded five minutes'
            }
            if ($process.ExitCode -ne 0) { throw "Native acceptance failed: $($process.ExitCode)" }
          } finally {
            if ($null -ne $process -and -not $process.HasExited) { taskkill /PID $process.Id /T /F }
            Remove-NetFirewallRule -Name $rule -ErrorAction Stop
            if (Get-NetFirewallRule -Name $rule -ErrorAction SilentlyContinue) { throw 'Firewall rule was not removed' }
          }

      # Linux network isolation runs as root. The CLI creates private report
      # files, so return ownership before the unprivileged artifact uploader.
      - name: Restore Linux evidence ownership
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if [ -d .dev/out/mck-release-acceptance ]; then
            sudo chown -R "$(id -u):$(id -g)" .dev/out/mck-release-acceptance
          fi

      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mck-release-acceptance-${{ matrix.target }}
          path: .dev/out/mck-release-acceptance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
