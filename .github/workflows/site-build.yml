name: Site build

# Builds, checks and tests the project site. CI calls it for every change that touches a site
# input, so ci-ok covers it in pull requests and the merge queue. The Site workflow calls it on
# main with `pages: true` and deploys the result.
on:
  workflow_call:
    inputs:
      pages:
        description: Upload _site as the GitHub Pages artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_MAIN: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up cached MoonBit
        uses: ./.github/actions/setup-moonbit

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript

      - name: Update Mooncakes registry
        run: moon update

      - name: Install site dependencies
        run: |
          bun install --frozen-lockfile --cwd apps/morphir-site
          bun install --frozen-lockfile --cwd apps/morphir-workbench
          bun run --cwd apps/morphir-site playwright install --with-deps chromium

      - name: Build site
        run: bun --check apps/morphir-site/scripts/build.ts

      - name: Check site
        working-directory: apps/morphir-site
        run: moon run --target native check -- --dir ../../_site

      - name: Test site
        run: |
          (cd apps/morphir-site && moon test --target native \
            -p finos/morphir-site/model finos/morphir-site/content finos/morphir-site/views \
            finos/morphir-site/site finos/morphir-site/generate)
          (cd apps/morphir-site && moon test --target js -p finos/morphir-site/model)
          bun run --cwd apps/morphir-site test
          bun run --cwd apps/morphir-site test:browser

      - name: Upload Pages artifact
        if: inputs.pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
