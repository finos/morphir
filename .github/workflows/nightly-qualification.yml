name: Nightly qualification

# Entry workflow of the full qualification with the macOS lanes. It is the only
# scheduled caller of qualification.yml, so macOS runners never run on a pull
# request, merge queue or branch push. See qualification.yml for the modes.
#
# The `evidence` job fingerprints the macOS inputs and looks for trusted evidence
# under that fingerprint (scripts/ci-evidence.mbtx mode). On a hit the call runs
# with `macos: reuse` and the macOS jobs skip. On a miss, for a dispatch with
# `macos=run`, or while a `macos-breach` issue is open, they run. After a `run`
# pass on main, `record` uploads the evidence artifact
# `macos-evidence-v1-<fingerprint>` (8 days; trusted for 7).
#
# The `report` job keeps one `macos-breach` issue: a run that does not pass opens
# it or comments on it, and only a passing `run` closes it.
#
# The `native-services` job runs `scripts/native-services.mbtx --acceptance`:
# the Rust adapter over the pinned shared finos/morphir libraries, the native
# CLI's extension commands with the native guest and the Rust fault peer, and the
# local repository lifecycle. It runs on Linux x64 and arm64 every night, and on
# macos-15 only when the evidence job chooses `run`. Windows is not supported:
# process workers are not qualified there. A dispatch with
# `lanes=native-services` runs only this job and the macOS mode choice.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      macos:
        description: 'macOS lanes: evidence reuses proven results when it can, run always runs them'
        type: choice
        options: [evidence, run]
        default: evidence
      lanes:
        description: 'Lanes: all, or native-services for that acceptance alone'
        type: choice
        options: [all, native-services]
        default: all

permissions:
  contents: read

concurrency:
  group: nightly-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Choose the macOS mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read lists the evidence artifacts and reads the runs that
    # uploaded them. issues: read finds an open macos-breach issue: while one
    # is open, the lookup chooses run, so old evidence cannot hide a newer
    # failed run on the same inputs.
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      macos: ${{ steps.mode.outputs.macos }}
      evidence: ${{ steps.mode.outputs.evidence }}
      fingerprint: ${{ steps.mode.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-moonbit
      - name: Update Mooncakes registry for the evidence script
        run: moon update
      # The schedule has no inputs, so it asks for evidence. The script writes
      # fingerprint=, macos= and evidence= to GITHUB_OUTPUT; `run` gets an empty
      # evidence reference, because the gate refuses one.
      - name: Choose the macOS mode
        id: mode
        env:
          CI_MACOS_REQUESTED: ${{ inputs.macos || 'evidence' }}
          GH_TOKEN: ${{ github.token }}
        run: moonx scripts/ci-evidence.mbtx mode --github-output --json

  qualification:
    name: Full qualification
    needs: evidence
    if: inputs.lanes != 'native-services'
    uses: ./.github/workflows/qualification.yml
    with:
      macos: ${{ needs.evidence.outputs.macos }}
      macos-evidence: ${{ needs.evidence.outputs.evidence }}
    permissions:
      contents: read
      attestations: read

  native-services:
    name: Native services acceptance (${{ matrix.os }})
    needs: evidence
    strategy:
      fail-fast: false
      matrix:
        # yamllint disable-line rule:line-length
        os: ${{ fromJSON(needs.evidence.outputs.macos == 'run' && '["ubuntu-24.04","ubuntu-24.04-arm","macos-15"]' || '["ubuntu-24.04","ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-moonbit
        with:
          tools: http:moonbit bun
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Resolve pinned MoonBit packages
        run: moon update
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      # The script names the revision it requires.
      - name: Read the shared Morphir revision
        id: shared
        run: moon run scripts/native-services.mbtx -- --revision --github-output
      - name: Check out the pinned shared Morphir libraries
        uses: actions/checkout@v7
        with:
          repository: finos/morphir
          ref: ${{ steps.shared.outputs.revision }}
          path: .dev/shared-morphir
      - name: Populate the shared Rust submodule
        run: git -C .dev/shared-morphir submodule update --init ecosystem/morphir-rust
      # stdout is the morphir/command-result document, with the SHA-256 and
      # size of each artifact; build and test output go to stderr. mise exec
      # puts bun on PATH.
      - name: Run the native-services acceptance
        shell: bash
        run: >-
          mise exec -- moon run scripts/native-services.mbtx --
          --acceptance --shared .dev/shared-morphir --json
          > .dev/native-services-result.json
      - name: Show the acceptance result
        if: always()
        shell: bash
        run: cat .dev/native-services-result.json || true
      - name: Retain the acceptance result and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # yamllint disable-line rule:line-length
          name: native-services-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .dev/native-services-result.json
            .dev/native-services/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  # Records evidence only after the macOS lanes ran and the whole call passed on
  # main. It uploads the fingerprint that the evidence job chose and fails if
  # HEAD has another one. A reuse run records nothing, so evidence never
  # renews itself.
  record:
    name: Record the macOS evidence
    needs: [evidence, qualification, native-services]
    if: >-
      needs.qualification.result == 'success' &&
      needs.native-services.result == 'success' &&
      needs.evidence.outputs.macos == 'run' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-moonbit
      - name: Update Mooncakes registry for the evidence script
        run: moon update
      - name: Write the evidence file
        env:
          FINGERPRINT: ${{ needs.evidence.outputs.fingerprint }}
        run: >-
          moonx scripts/ci-evidence.mbtx record --fingerprint "$FINGERPRINT"
          --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
          --out "$RUNNER_TEMP/evidence.json"
      - name: Upload the evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-evidence-v1-${{ needs.evidence.outputs.fingerprint }}
          path: ${{ runner.temp }}/evidence.json
          retention-days: 8
          if-no-files-found: error
          # A re-run of all jobs of a run that already recorded uploads again.
          overwrite: true

  report:
    name: Report the breach issue
    needs: [evidence, qualification, native-services, record]
    # Fires on every outcome of the jobs above, so that a failure cannot stay
    # silent. Only runs on main: a dispatch on another ref must not touch the issue.
    # A native-services-only dispatch skips the qualification, so it reports
    # nothing; its own job result is the signal.
    if: always() && github.ref == 'refs/heads/main' && inputs.lanes != 'native-services'
    # Housekeeping must not turn a passing night red, so a failure of this job
    # (checkout, setup-moonbit, moon update, the close step) is non-fatal when the
    # night passed. The expression is true only when the night passed: it is the
    # negation of (the breach test in RESULT below, or a qualification that did
    # not succeed). A failing night gets `false`: the failed jobs keep the run
    # red, and a report job that fails there fails the run too, so a breach
    # cannot go unreported without a red run.
    # (env is not available here, so RESULT cannot be reused.)
    continue-on-error: >-
      ${{ !(needs.evidence.result != 'success' ||
      needs.native-services.result != 'success' ||
      needs.record.result == 'failure' ||
      needs.record.result == 'cancelled' ||
      needs.qualification.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read lists the failed jobs of this run in the issue.
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      # An evidence job that did not succeed is a failure, even though the call
      # was then skipped. So is a native-services job that did not succeed.
      # `record` skips in reuse mode and after a failed call; only its failure
      # or cancellation is a breach of its own.
      RESULT: >-
        ${{ (needs.evidence.result != 'success' ||
        needs.native-services.result != 'success' ||
        needs.record.result == 'failure' ||
        needs.record.result == 'cancelled') && 'failure' ||
        needs.qualification.result }}
      MODE: ${{ needs.evidence.outputs.macos }}
      # The attempt makes a re-run link to its own jobs, not to the latest attempt.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-moonbit
      - name: Update Mooncakes registry for the report script
        run: moon update
      # Open the issue or comment on it, with the failed jobs of this run. It
      # only runs on a night that did not pass, so a failure here fails the run.
      - name: Report the breach
        if: env.RESULT != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          moonx scripts/ci-breach.mbtx --result "$RESULT" --run-url "$RUN_URL"
          --sha "$GITHUB_SHA" --mode "$MODE" --run-id "$GITHUB_RUN_ID"
      # Only a pass that ran the macOS lanes closes the issue; a reuse pass
      # proves nothing new. Closing is housekeeping: the qualification passed,
      # so a failed close must not turn the run red.
      - name: Close the breach issue
        if: env.RESULT == 'success' && env.MODE == 'run'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          moonx scripts/ci-breach.mbtx --result "$RESULT" --run-url "$RUN_URL"
          --sha "$GITHUB_SHA" --mode "$MODE"
