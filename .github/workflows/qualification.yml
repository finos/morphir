name: Full qualification

# Each run checks its exact github.sha. Release callers must use that candidate,
# including the workflow's own artifacts, rather than a previous main result.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  attestations: read

concurrency:
  group: qualification-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  setup:
    name: Toolchain setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # Exercise a fresh local-style install without the CI cache repair step.
      - uses: jdx/mise-action@v5
        with:
          install_args: http:moonbit bun
          cache: false
      - name: Verify the stock core after a fresh install
        run: mise run setup:core
      - name: Check the stock core and decimal parsing after a fresh install
        run: mise run check:core
      - name: Update Mooncakes registry for script dependencies
        run: mise exec -- moon update
      - name: Check MoonBit script execution
        run: mise exec -- moonx scripts/ci-gate.mbtx --self-test
      - name: Check repository tasks and failure propagation
        run: mise exec -- moonx scripts/repository-tasks.mbtx --self-test
      - name: Check pinned IR fixture regeneration
        run: mise exec -- moonx scripts/refresh-ir-fixtures.mbtx --self-test
      - name: Check Git hook installation in checkouts and worktrees
        run: mise exec -- moonx scripts/setup-hooks.mbtx --self-test
      - name: Check pre-push validation failures
        run: mise exec -- moonx scripts/pre-push.mbtx --self-test
      - name: Check pinned beads helper caching and arguments
        run: mise exec -- moonx scripts/beads-plan.mbtx --self-test

  native:
    name: Full native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    uses: ./.github/workflows/ci-native.yml
    with:
      runner: ${{ matrix.os }}
      acceptance-lanes: '["compiler","frontend","conformance"]'
      provider: true
      full: true

  installed:
    name: Full installed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    uses: ./.github/workflows/ci-installed.yml
    with:
      runner: ${{ matrix.os }}
      lifecycle: true
      telemetry: true
      workbench: true

  packaged:
    name: Actual packaged fallback
    uses: ./.github/workflows/ci-packaged.yml

  qualification-ok:
    name: qualification-ok
    runs-on: ubuntu-latest
    if: always()
    needs: [setup, native, installed, packaged]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-moonbit
      - name: Update Mooncakes registry for pinned gate dependencies
        run: moon update
      - name: Require the full matrix and bind its candidate receipt
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_REQUIRED_JOBS: '["setup","native","installed","packaged"]'
        run: moonx scripts/ci-gate.mbtx --qualification
      - name: Retain exact candidate qualification receipt
        uses: actions/upload-artifact@v7
        with:
          name: qualification-${{ github.sha }}
          path: .dev/qualification/receipt.ionb
          if-no-files-found: error
