name: CI

on:
  push:
    branches:
      - main
      - setup/**
  pull_request:
    branches:
      - main
      - milestone/**

# Cancel a pull request's in-progress run when a new push supersedes it. Pull
# requests are keyed by number rather than by head branch: two forks can both
# offer a branch called `main`, and keying on the branch name would let one
# fork's push cancel the other's run.
#
# Push runs (main, setup/**) are never cancelled. They are the only runs that
# save the shared caches, and every commit on main keeps its own result. A
# second push to the same branch waits for the first instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # setup-rust-ci enables the compiler wrapper after installing sccache.
  # mise may compile Cargo tools before that action runs on a cold cache.

jobs:
  # Detect what files changed to enable fast-path for docs-only changes
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      rust-conformance: ${{ steps.filter.outputs.rust-conformance }}
      docs: ${{ steps.filter.outputs.docs }}
      mck: ${{ steps.filter.outputs.mck }}
      package-mck: ${{ steps.filter.outputs.package-mck }}
      release: ${{ steps.filter.outputs.release }}
      toolchain-contracts: ${{ steps.filter.outputs.toolchain-contracts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              # The Rust development tools are not in this repository. They are
              # the umbrella-tools workspace of this submodule, which also holds
              # the crates that workspace depends on, so a ref bump changes
              # compiled source.
              - 'ecosystem/morphir-rust'
              - '.gitmodules'
              # mck_run in morphir-mck-cli replays and compares these frozen inputs.
              - 'spec/mck/baseline/package/**'
              # mep_contract in morphir-dev-tools checks the committed MEP contract IR
              - 'spec/mep/**'
              # package_runtime in morphir-dev-tools reads the fixed package fixtures
              - 'spec/package/mck/fixtures/**'
              # kb_acceptance drives morphir-dev kb over these OKF rules
              - 'kb/**'
              # pins the Rust toolchain these jobs build with
              - '.config/mise/**'
              # signed fixtures and schemas are executable acquisition contracts
              - 'docs/spec/tool-release-metadata/**'
              - 'website/static/schemas/tool-release-v1.schema.json'
              # asserts every workspace package follows the current Rust baseline
              - 'tests/rust/test_workspace_rust_baseline.py'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust-ci/**'
            toolchain-contracts:
              - 'LICENSE'
              - 'NOTICE'
              - 'docs/spec/toolchain/**'
              - 'docs/spec/tool-release-metadata/**'
              - 'website/static/schemas/toolset-recipe-*.schema.json'
              - 'website/static/schemas/toolchain-*.schema.json'
              - 'website/static/schemas/morphirup-result-*.schema.json'
              - 'website/static/schemas/tool-release-v1.schema.json'
              - 'website/static/schemas/morphir-ir-v4.json'
              - 'spec/toolchain/**'
              - 'docs/design/proposals/toolchain-acquisition.md'
              - 'docs/design/proposals/index.md'
              - 'docs/assets/toolchain-*.svg'
              - 'tools/check-toolchain-contracts*'
              - 'tools/check-toolchain-corpus*'
              - 'tools/spec-mep-smithy.ts'
              - '.config/toolchain-contract-tests.json'
              - '.config/mise/config.toml'
              - '.github/workflows/ci.yml'
            # Kit and schema changes run binding conformance here and focused
            # native MCK tests in docs, without the full Rust extension pipeline.
            # That job also runs for every `rust` change, so the inputs both
            # share (the Rust submodule, the examples, the toolchain pins, this
            # workflow) are listed under `rust` only.
            rust-conformance:
              # mck:run-rust runs the kit against the Rust binding, so its fences are an input
              - 'spec/ir/mck/**'
              - 'spec/mck/**'
              # the kit's IR fences are checked against the v4 schema
              - 'website/static/schemas/morphir-ir-v4.json'
              - 'website/static/schemas/morphir-ir-v4.yaml'
              - 'website/static/schemas/morphir-ir-v4-document-tree-files.json'
              - 'website/static/schemas/morphir-ir-v4-document-tree-files.yaml'
              # the TypeScript implementation owns its independent adapter
              - 'ecosystem/morphir-typescript'
              # resolves and runs the Rust binding's MCK adapter
              - 'tools/run-mck-gate*'
              - 'tools/record-mck-transcript*'
              - 'tools/mck-ci-summary*'
            docs:
              - 'openspec/**'
              - 'website/**'
              - 'docs/**'
              - '**/*.md'
              - 'spec/ir/**'
              - 'spec/package/**'
              - 'spec/workbench/**'
              - 'spec/conceptual/**'
              # examples:validate checks the readiness workflow case's expected IR
              - 'spec/toolchain/**'
              # the tracked IR fixtures and the corpus generator are validated
              # in the docs job, and the mise tasks define what that job runs
              - 'tests/bdd/fixtures/**'
              - 'tools/gen-naming-corpus.ts'
              - 'tools/check-vendored-fixture.ts'
              # regenerates the JSON schemas and compares them with the committed ones
              - 'tools/check-schemas-generated.ts'
              # spec:mep-smithy-check validates the MEP Smithy model against the
              # protocol draft examples and the MEP MCK cases
              - 'spec/mep/**'
              - 'tools/spec-mep-smithy*'
              # the Bun tooling tests the docs job runs through `mise run tools:test`
              - 'tools/*.test.ts'
              - 'tools/run-mck-gate.ts'
              - 'tools/mck-ci-summary.ts'
              - '.config/mise/**'
              - '.github/workflows/ci.yml'
            mck:
              - '.github/actions/setup-rust-ci/**'
              - 'spec/ir/mck/**'
              # parent-owned kit data and contracts mck:check validates
              - 'spec/mck/**'
              - 'spec/workbench/**'
              - 'website/static/schemas/morphir-ir-v4.json'
              - 'website/static/schemas/morphir-ir-v4-document-tree-files.json'
              - 'website/static/schemas/morphir-ir-v4.yaml'
              - 'website/static/schemas/morphir-ir-v4-document-tree-files.yaml'
              - 'tools/gen-mck-vocabulary*'
              - 'tools/run-mck-gate*'
              - 'tools/record-mck-transcript*'
              - 'tools/mck-ci-summary*'
              - 'ecosystem/morphir-typescript'
              # The native runner, report reader and renderer that drive this
              # job are built from this submodule (umbrella-tools), and the Rust
              # binding is driven through its adapter by mck:run-rust, so a
              # pointer bump has to re-run the kit validations too.
              - 'ecosystem/morphir-rust'
              # the Gleam mirror is checked by the mck driver once its adapter
              # lands; routing its pointer bumps here keeps them from skipping
              # every validation job in the meantime
              - 'ecosystem/morphir-gleam'
              - '.config/mise/config.toml'
              - '.github/workflows/ci.yml'
            package-mck:
              - 'spec/mck/baseline/package-cases.json'
              - '.github/actions/setup-rust-ci/**'
              - 'tools/record-mck-transcript*'
              - 'spec/package/**'
              # the runner, the package fixture tools, the vendored rust-tuf
              # they verify with, and the Rust adapter
              - 'ecosystem/morphir-rust'
              - 'ecosystem/morphir-typescript'
              - 'tools/run-package-mck.ts'
              - 'tools/package-mck-command*'
              - 'tools/package-ci.test.ts'
              - 'tools/package.json'
              - 'tools/bun.lock'
              - 'tools/tsconfig.json'
              - '.gitmodules'
              - '.config/mise/config.toml'
              - '.github/workflows/ci.yml'
            release:
              - '.github/workflows/release.yml'
              # the official CLI release: its expectations, checks and the pinned source
              - '.config/cli-release.json'
              - 'tools/cli-release*'
              - 'ecosystem/morphir-dotnet'
              - '.gitmodules'
              # tests/ci reads the MCK runner's manifest, lock file and tests there
              - 'ecosystem/morphir-rust'
              # historical acceptance of released Rust CLI tags
              - '.github/workflows/mck-release-acceptance.yml'
              - 'tools/mck-release-acceptance.mjs'
              - 'tools/mck-release-version*.mjs'
              - 'tools/mck-release-qualification*.mjs'
              # every test here asserts workflow or action content
              - 'tests/ci/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'

  toolchain-contracts:
    name: Toolchain acquisition contracts (.NET)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.toolchain-contracts == 'true' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Read the exact .NET source pin
        id: source
        run: bun run tools/check-toolchain-contracts.ts source --github-output "$GITHUB_OUTPUT"
      - name: Checkout the implementation
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: .dev/toolchain-contract-source
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: .dev/toolchain-contract-source/global.json
      - name: Check this checkout's corpus using the .NET implementation
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun run tools/check-toolchain-contracts.ts check --source .dev/toolchain-contract-source

  # Fast feedback: formatting + lint
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Initialize environment
        run: mise run init -- --ci

      - name: Add Rust components
        run: rustup component add rustfmt clippy

      - name: Set up Rust CI
        uses: ./.github/actions/setup-rust-ci

      - name: Check formatting
        run: cargo fmt --manifest-path ecosystem/morphir-rust/umbrella-tools/Cargo.toml --package morphir-mck-cli --package morphir-dev-tools --check

      - name: Run clippy
        run: cargo clippy --locked --manifest-path ecosystem/morphir-rust/umbrella-tools/Cargo.toml --package morphir-mck-cli --package morphir-dev-tools --all-targets -- -D warnings

  # The Rust development tools: the standalone MCK runner (morphir-mck), the
  # internal development tool (morphir-dev) and the reference contract
  # checkers. Their source is the umbrella-tools workspace of the
  # ecosystem/morphir-rust submodule; they are tested here because they read
  # this repository's specifications and fixtures. The Rust product CLI and its
  # integration jobs were deleted; the Morphir CLI is built and qualified from
  # finos/morphir-dotnet by release.yml.
  rust-dev-tools:
    name: Rust development tools (test)
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Initialize environment
        run: mise run init -- --ci

      - name: Set up Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          # This job builds the most, so it is the one writer of the shared
          # cargo cache. lint only restores it.
          save-cache: "true"

      # morphir-mck: the shared runner's command line, end to end, including
      # the copied-binary acceptance with an empty tool path.
      - name: Test the standalone MCK runner
        run: cargo test --locked --manifest-path ecosystem/morphir-rust/umbrella-tools/Cargo.toml --package morphir-mck-cli

      # The MCK engine is a library crate of its own.
      - name: Run MCK engine tests
        run: cargo test --locked --manifest-path ecosystem/morphir-rust/umbrella-tools/Cargo.toml --package morphir-mck

      # morphir-dev: the kb commands and the repository contract gates
      # (MEP contract IR, tool release metadata, package runtime vectors).
      - name: Test the internal development tool and repository gates
        run: cargo test --locked --manifest-path ecosystem/morphir-rust/umbrella-tools/Cargo.toml --package morphir-dev-tools

      - name: Validate signed tool release metadata
        run: mise run ci:validate-tool-release-metadata

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.mck == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Initialize (CI mode)
        run: mise run init -- --ci

      - name: Set up Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          # Documentation and contract tools use the toolchain's default linker.
          # Installing the optional linker must not require apt before these checks.
          install-mold: "false"

      # The pinned mission-control-tools binary checks the managed html-design
      # files against the lock and against its own bundle.
      - name: Check the shared OpenSpec bundle
        run: mission-control-tools openspec check --bundle

      - name: Validate the shared OpenSpec workflow
        run: mise run openspec:validate

      - name: Validate schemas against the metaschema
        run: mise run schema:validate

      # Regenerates every JSON schema from its YAML source (installing the
      # website dependencies first) and fails if a committed JSON differed.
      # It runs before the sync check, so that check compares morphir-rust's
      # copy with JSON known to match the YAML.
      - name: Check the committed JSON schemas match their YAML sources
        run: mise run check:schemas-generated

      - name: Check morphir-rust embeds the generated configuration schema
        run: mise run check:config-schema-sync

      - name: Validate published examples
        run: mise run examples:validate

      - name: Validate the tracked IR fixtures
        run: mise run fixtures:validate

      - name: Check the naming conformance corpus is current
        run: mise run fixtures:naming-corpus-check

      - name: Check the format-version conformance corpus and its vendored copy agree
        run: mise run fixtures:format-version-corpus-check

      - name: Run the Bun specification tooling tests
        run: mise run tools:test

      - name: Website IR conformance runner
        run: mise run website:test-ir-storage-profiles

      - name: Check the Morphir Compatibility Kit
        run: mise run mck:check

      - name: Check the MEP Smithy model against MEP examples and MCK cases
        run: mise run spec:mep-smithy-check

      - name: Test the native MCK engine for kit and schema changes
        if: ${{ needs.changes.outputs.mck == 'true' && needs.changes.outputs.rust != 'true' }}
        run: cargo test --locked --manifest-path ecosystem/morphir-rust/umbrella-tools/Cargo.toml --package morphir-mck

      - name: Run the kit against the TypeScript binding
        run: |
          rm -f .dev/out/mck/morphir-typescript-adapter.json .dev/out/mck/morphir-typescript-adapter.html
          mise run mck:run

      - name: Summarize TypeScript binding conformance
        if: always()
        run: bun run tools/mck-ci-summary.ts TypeScript .dev/out/mck/morphir-typescript-adapter.json mck-reports

      - name: Validate draft package schemas and examples
        run: mise run package:schema-check

      - name: Validate draft Workbench schemas and codec corpus
        run: mise run workbench:schema-check

      - name: Check conceptual model reference fixtures
        run: mise run conceptual:fixtures-check

      # The package suite itself runs in the package-mck job, whose filter
      # covers every input of `package:check`.
      - name: Upload MCK reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mck-reports
          path: |
            .dev/out/mck/morphir-typescript-adapter.json
            .dev/out/mck/morphir-typescript-adapter.html
            .dev/out/mck/morphir-typescript-adapter.ndjson

  # Kit run against the Rust binding. It builds from the shared cargo cache
  # and runs beside the development tools job instead of inside it. The
  # migrate validation that also ran here was a check of the deleted Rust
  # product CLI's `migrate` command; see `mise run migrate:validate`.
  rust-conformance:
    name: Rust conformance (MCK)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.rust-conformance == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Initialize environment
        run: mise run init -- --ci

      - name: Set up Rust CI
        uses: ./.github/actions/setup-rust-ci

      - name: Run the kit against the Rust binding
        run: |
          rm -f .dev/out/mck/morphir-rust.json .dev/out/mck/morphir-rust.html
          mise run mck:run-rust

      - name: Summarize Rust binding conformance
        if: always()
        run: bun run tools/mck-ci-summary.ts Rust .dev/out/mck/morphir-rust.json mck-report-morphir-rust

      - name: Upload the Rust binding's MCK report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mck-report-morphir-rust
          path: |
            .dev/out/mck/morphir-rust.json
            .dev/out/mck/morphir-rust.html
            .dev/out/mck/morphir-rust.ndjson
            .dev/out/mck/node-address-rust.json

  package-mck:
    name: MCK package compatibility (TypeScript + Rust)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.package-mck == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up native Rust runner build
        uses: ./.github/actions/setup-rust-ci
      - name: Install integration test types
        run: bun install --frozen-lockfile
        working-directory: tools
      - name: Check integration tooling
        id: integration
        run: |
          bun run --cwd tools typecheck
          bun test tools/package-mck-command.test.ts tools/record-mck-transcript.test.ts tools/package-ci.test.ts
      - name: Run TypeScript package implementation
        run: mise run package:check
      - name: Inspect candidate restore definitions and pending bindings
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: mise run package:definitions-check
      - name: Reproduce and independently verify signed fixtures offline
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: mise run package:fixture-check
      - name: Check synthetic restore assurance preflight vectors
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: mise run package:assurance-check
      - name: Check publisher signatures for fixed release statements
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: mise run package:publisher-check
      - name: Run independent Rust package implementation
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: mise run package:check:rust
      - name: Run TypeScript package resolution implementation
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: mise run package:resolution-check
      - name: Run independent Rust package resolution implementation
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: mise run package:resolution-check:rust
      - name: Run signed local Library MVP cases through native MCK
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: mise run package:mvp-check
      - name: Upload package compatibility reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mck-package-implementations
          path: .dev/out/mck/package-*.json
          if-no-files-found: error

  release-workflow:
    name: Release workflow
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The release tests read the pinned CLI source's build profiles and
      # CHANGELOG, so the submodule must be at its recorded commit. The
      # acceptance tests in tests/ci read the MCK runner's sources, which are in
      # the morphir-rust submodule (umbrella-tools).
      - name: Check out the pinned CLI source and the development tools
        run: git submodule update --init --depth 1 ecosystem/morphir-dotnet ecosystem/morphir-rust

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install tooling dependencies
        run: bun install --frozen-lockfile
        working-directory: tools

      - name: Test the official CLI release orchestration
        run: bun test tools/cli-release.test.ts

      - name: Verify the CLI source pin
        run: bun run tools/cli-release.ts verify-source

      - name: Validate release workflow
        run: python3 -B -m unittest discover -s tests/ci

      - name: Validate release acceptance preparation syntax
        run: node --check tools/mck-release-acceptance.mjs

      - name: Test published CLI version and qualification selection
        run: node --test tools/mck-release-version.test.mjs tools/mck-release-qualification.test.mjs

  check:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [changes, lint, rust-dev-tools, docs, rust-conformance, release-workflow, package-mck, toolchain-contracts]
    if: always()
    steps:
      - name: Check results
        run: |
          # This is the one required status check. A job the change did not
          # select is skipped, and a skipped job passes here; a selected job
          # has to succeed.
          failed=0
          require() {
            # require <selected> <job> <result>
            if [[ "$1" == "true" && "$3" != "success" ]]; then
              echo "::error::$2 was required and did not succeed (result: $3)"
              failed=1
            fi
          }
          # Without the filter outputs nothing below would be selected, and
          # the gate would pass without having checked anything.
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::change detection did not succeed (result: ${{ needs.changes.result }})"
            exit 1
          fi
          require "${{ needs.changes.outputs.rust }}" lint "${{ needs.lint.result }}"
          require "${{ needs.changes.outputs.rust }}" rust-dev-tools "${{ needs.rust-dev-tools.result }}"
          if [[ "${{ needs.changes.outputs.rust }}" == "true" || "${{ needs.changes.outputs.rust-conformance }}" == "true" ]]; then
            require true rust-conformance "${{ needs.rust-conformance.result }}"
          fi
          if [[ "${{ needs.changes.outputs.docs }}" == "true" || "${{ needs.changes.outputs.mck }}" == "true" ]]; then
            require true docs "${{ needs.docs.result }}"
          fi
          require "${{ needs.changes.outputs.release }}" release-workflow "${{ needs.release-workflow.result }}"
          require "${{ needs.changes.outputs.package-mck }}" package-mck "${{ needs.package-mck.result }}"
          require "${{ needs.changes.outputs.toolchain-contracts }}" toolchain-contracts "${{ needs.toolchain-contracts.result }}"
          if [[ "$failed" != "0" ]]; then
            exit 1
          fi
          echo "All required checks passed!"
