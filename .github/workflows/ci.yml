name: CI

on:
  push:
    branches:
      - main
      - setup/**
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect what files changed to enable fast-path for docs-only changes
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              # crates/morphir and crates/morphir-live path-depend on crates
              # inside this submodule, so a ref bump changes compiled source
              - 'ecosystem/morphir-rust'
              - '.gitmodules'
              # pins the Rust toolchain these jobs build with
              - '.config/mise/**'
              # generated CLI docs are diff-checked against the CLI source
              - 'docs/cli/**'
              - 'docs/man/**'
              - 'completions/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'website/**'
              - 'docs/**'
              - '**/*.md'
              # the script the Docs job runs
              - '.config/mise/tasks/ci/validate_docs.py'
              - '.github/workflows/ci.yml'
            release:
              - '.github/workflows/release.yml'
              - '.github/workflows/deploy-release-pages.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/morphir/Cargo.toml'
              - 'tests/ci/test_release_workflow.py'
              - 'tests/ci/test_select_release_assets.py'
              - '.github/scripts/select_release_assets.py'
              - '.github/workflows/ci.yml'

  # morphir-live: web UI application (depends on dioxus)
  morphir-live:
    name: morphir-live
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Initialize environment
        run: mise run init -- --ci

      - name: Add Rust components
        run: rustup component add rustfmt clippy

      - name: Install GTK dependencies (for desktop build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev libxdo-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: morphir-live

      - name: Check formatting
        run: cargo fmt --package morphir-live --check

      - name: Run clippy
        run: cargo clippy --locked --package morphir-live --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --package morphir-live

      - name: Build (web)
        run: cargo build --locked --release --package morphir-live

      - name: Build (desktop)
        run: cargo build --locked --release --package morphir-live --features desktop

  # morphir: CLI tool (depends on extism via morphir-daemon)
  morphir-cli:
    name: morphir CLI
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Initialize environment
        run: mise run init -- --ci

      - name: Add Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: morphir-cli

      - name: Check formatting
        run: cargo fmt --package morphir --check

      - name: Run clippy
        run: cargo clippy --locked --package morphir --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --package morphir

      - name: Build
        run: cargo build --locked --release --package morphir

      - name: Generate CLI docs
        run: mise run docs:cli

      - name: Check CLI docs are up to date
        run: |
          if ! git diff --quiet docs/cli docs/man completions; then
            echo "::error::Generated CLI documentation is out of date. Run 'mise run docs:cli' and commit the changes."
            git diff docs/cli docs/man completions
            exit 1
          fi

  # Docs: lightweight job for documentation changes (fast-path)
  # Note: This job intentionally does NOT install mise to stay fast
  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate documentation
        run: python3 .config/mise/tasks/ci/validate_docs.py

  release-workflow:
    name: Release workflow
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate release workflow
        run: python3 -B -m unittest discover -s tests/ci

  check:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [changes, morphir-live, morphir-cli, docs, release-workflow]
    if: always()
    steps:
      - name: Check results
        run: |
          # Check if rust jobs were required and passed
          if [[ "${{ needs.changes.outputs.rust }}" == "true" ]]; then
            if [[ "${{ needs.morphir-live.result }}" != "success" ]]; then
              echo "morphir-live failed"
              exit 1
            fi
            if [[ "${{ needs.morphir-cli.result }}" != "success" ]]; then
              echo "morphir-cli failed"
              exit 1
            fi
          fi
          # Check if docs job was required and passed
          if [[ "${{ needs.changes.outputs.docs }}" == "true" ]]; then
            if [[ "${{ needs.docs.result }}" != "success" ]]; then
              echo "docs failed"
              exit 1
            fi
          fi
          if [[ "${{ needs.changes.outputs.release }}" == "true" ]]; then
            if [[ "${{ needs.release-workflow.result }}" != "success" ]]; then
              echo "release workflow validation failed"
              exit 1
            fi
          fi
          echo "All required checks passed!"

  # TODO: Add WASM build once dioxus-cli workspace issue is resolved
