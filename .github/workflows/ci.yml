name: CI

on:
  push:
    branches:
      - main
      - setup/**
  pull_request:
    branches:
      - main

# Cancel in-progress runs when a new run supersedes them. Pull requests are keyed
# by number rather than by head branch: two forks can both offer a branch called
# `main`, and keying on the branch name would let one fork's push cancel the
# other's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # setup-rust-ci enables the compiler wrapper after installing sccache.
  # mise may compile Cargo tools before that action runs on a cold cache.

jobs:
  # Detect what files changed to enable fast-path for docs-only changes
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      mck: ${{ steps.filter.outputs.mck }}
      package-mck: ${{ steps.filter.outputs.package-mck }}
      release: ${{ steps.filter.outputs.release }}
      desktop-demo: ${{ steps.filter.outputs.desktop-demo }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            desktop-demo:
              - 'tools/demo-desktop*'
              - 'tools/package.json'
              - 'tools/bun.lock'
              - 'tools/tsconfig.json'
              - '.config/mise/config.toml'
              - '.github/workflows/ci.yml'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              # crates/morphir path-depends on crates inside this submodule,
              # so a ref bump changes compiled source
              - 'ecosystem/morphir-rust'
              # crates/morphir tests the configured Elm process extension
              - 'ecosystem/morphir-elm'
              # crates/morphir acquires and runs the Scala Elm process extension
              - 'ecosystem/morphir-scala'
              - '.gitmodules'
              # pins the Rust toolchain these jobs build with
              - '.config/mise/**'
              # generated CLI docs are diff-checked against the CLI source
              - 'docs/cli/**'
              - 'docs/man/**'
              # signed fixtures and schemas are executable acquisition contracts
              - 'docs/spec/tool-release-metadata/**'
              - 'website/static/schemas/tool-release-v1.schema.json'
              - 'completions/**'
              # asserts every workspace package follows the current Rust baseline
              - 'tests/rust/test_workspace_rust_baseline.py'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust-ci/**'
              - '.github/actions/cache-scala-native-image/**'
              # morphir-cli-test runs the kit against the Rust binding, so its fences are an input
              - 'spec/ir/mck/**'
              # the kit driver and the Rust binding's adapter live here
              - 'ecosystem/morphir-typescript'
              # adjudicates the Rust binding's MCK report against its allowed-failing list
              - 'tools/check-mck-report.ts'
              # resolves and runs the Rust binding's MCK adapter
              - 'tools/run-mck-rust.ts'
              - 'tools/rust-mck-command*'
              # validates the output of `mise run migrate:validate` against the v4 schema
              - 'website/scripts/validate-migrated-ir.js'
              # fixtures `mise run migrate:validate` migrates and validates
              - 'website/static/ir/examples/**'
              # the v4 schema `mise run migrate:validate` validates migrated IR against
              - 'website/static/schemas/morphir-ir-v4.json'
              # migrate:validate depends on website:install, and validate-migrated-ir.js imports ajv/ajv-formats from it
              - 'website/package.json'
              - 'website/package-lock.json'
            docs:
              - 'website/**'
              - 'docs/**'
              - '**/*.md'
              - 'spec/ir/**'
              - 'spec/package/**'
              # the tracked IR fixtures and the corpus generator are validated
              # in the docs job, and the mise tasks define what that job runs
              - 'tests/bdd/fixtures/**'
              - 'tools/gen-naming-corpus.ts'
              - 'tools/check-vendored-fixture.ts'
              # the Bun tooling tests the docs job runs through `mise run tools:test`
              - 'tools/*.test.ts'
              - '.config/mise/**'
              - '.github/workflows/ci.yml'
            mck:
              - 'spec/ir/mck/**'
              # checks every kit fence against the v4 JSON Schemas
              - 'tools/validate-mck-fences.ts'
              # checks the protocol example against the protocol schema and both
              # contract copies against the submodule originals
              - 'tools/validate-mck-protocol.ts'
              # adjudicates a driver report against a binding's allowed-failing list
              - 'tools/check-mck-report.ts'
              - 'tools/run-mck-rust.ts'
              - 'tools/rust-mck-command*'
              - 'ecosystem/morphir-typescript'
              # the Rust binding is driven through its adapter by mck:run-rust,
              # so a pointer bump has to re-run the kit validations too
              - 'ecosystem/morphir-rust'
              # the Gleam mirror is checked by the mck driver once its adapter
              # lands; routing its pointer bumps here keeps them from skipping
              # every validation job in the meantime
              - 'ecosystem/morphir-gleam'
              - '.config/mise/config.toml'
              - '.github/workflows/ci.yml'
            package-mck:
              - 'spec/package/**'
              - 'ecosystem/morphir-rust'
              - 'ecosystem/morphir-typescript'
              - 'tools/run-mck-rust.ts'
              - 'tools/rust-mck-command*'
              - 'tools/package-ci.test.ts'
              - 'tools/package.json'
              - 'tools/bun.lock'
              - 'tools/tsconfig.json'
              - '.gitmodules'
              - '.config/mise/config.toml'
              - '.github/workflows/ci.yml'
            release:
              - '.github/workflows/release.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/morphir/Cargo.toml'
              - 'tests/ci/test_release_workflow.py'
              - 'tests/ci/test_scala_extension_workflow.py'
              - 'tests/ci/test_ci_rust_optimizations.py'
              - 'tests/ci/test_select_release_assets.py'
              - '.github/scripts/select_release_assets.py'
              - '.github/workflows/ci.yml'

  desktop-demo:
    name: Desktop demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ needs.changes.outputs.desktop-demo == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: tools
      - run: bun run typecheck
        working-directory: tools
      - run: bun test tools/demo-desktop.test.ts

  # Fast feedback: formatting + lint (no GraalVM, no Elm build)
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Initialize environment
        run: mise run init -- --ci

      - name: Add Rust components
        run: rustup component add rustfmt clippy

      - name: Set up Rust CI
        uses: ./.github/actions/setup-rust-ci

      - name: Check formatting
        run: cargo fmt --package morphir --package integration-tests --check

      - name: Run clippy
        run: cargo clippy --locked --package morphir --package integration-tests --all-targets -- -D warnings

  # Build Morphir Elm process extension — parallel with lint + Scala
  build-elm-extension:
    name: Build Elm extension
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Initialize environment
        run: mise run init -- --ci

      - name: Install Morphir Elm tools
        env:
          MISE_AUTO_INSTALL: "false"
        run: |
          mise -C ecosystem/morphir-elm install
          test "$(mise -C ecosystem/morphir-elm exec -- bun --version)" = "1.4.0"
          test "$(mise -C ecosystem/morphir-elm exec -- elm --version)" = "0.19.1"

      - name: Install Morphir Elm dependencies
        env:
          MISE_AUTO_INSTALL: "false"
        run: >-
          mise -C ecosystem/morphir-elm exec --
          bun install --frozen-lockfile --ignore-scripts

      - name: Build Morphir Elm process extension
        env:
          MISE_AUTO_INSTALL: "false"
        run: mise -C ecosystem/morphir-elm run build:mep-extension

      - name: Upload Elm extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: morphir-elm-extension
          path: ecosystem/morphir-elm/dist/morphir-elm-extension/
          if-no-files-found: error
          retention-days: 1

  # Build Morphir Scala Elm process extension — parallel with lint + Elm
  build-scala-extension:
    name: Build Scala extension
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Initialize environment
        run: mise run init -- --ci

      - name: Set up GraalVM for the Morphir Scala provider
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: "true"

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8

      - name: Cache Scala native image
        uses: ./.github/actions/cache-scala-native-image

      - name: Build Morphir Scala Elm process extension
        working-directory: ecosystem/morphir-scala
        run: |
          ./mill --no-server --ticker false \
            morphir.langkit.elm.compiler.mep.jvm.nativeImage
          provider_version=$(./mill --no-server --ticker false show \
            morphir.langkit.elm.compiler.mep.jvm.mepProviderVersion |
            python3 -c 'import json, sys; print(json.load(sys.stdin))')
          printf 'MORPHIR_SCALA_ELM_EXTENSION_VERSION=%s\n' \
            "$provider_version" >> "$GITHUB_ENV"
          # Persist version for downstream job via artifact
          printf '%s' "$provider_version" > "$GITHUB_WORKSPACE/morphir-scala-version.txt"

      - name: Upload Scala extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: morphir-scala-extension
          path: |
            ecosystem/morphir-scala/out/morphir/langkit/elm/compiler/mep/jvm/nativeImage.dest/native-executable
            morphir-scala-version.txt
          if-no-files-found: error
          retention-days: 1

  # Main Rust build + integration tests — needs both extensions + lint
  morphir-cli-test:
    name: morphir CLI (test + integration)
    runs-on: ubuntu-latest
    needs: [changes, lint, build-elm-extension, build-scala-extension]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Initialize environment
        run: mise run init -- --ci

      - name: Add Rust components
        run: rustup component add rustfmt clippy

      - name: Download Elm extension
        uses: actions/download-artifact@v8
        with:
          name: morphir-elm-extension
          path: ecosystem/morphir-elm/dist/morphir-elm-extension

      - name: Prepare Elm extension
        run: |
          echo "Listing Elm artifact:"
          ls -R ecosystem/morphir-elm/dist/morphir-elm-extension || true
          ELM_BIN=$(find ecosystem/morphir-elm/dist/morphir-elm-extension -name "morphir-elm-extension" -type f | head -n 1)
          if [ -z "$ELM_BIN" ]; then
            echo "::error::morphir-elm-extension not found"
            exit 1
          fi
          chmod +x "$ELM_BIN"
          echo "Elm binary at $ELM_BIN:"
          ls -la "$ELM_BIN"

      - name: Download Scala extension
        uses: actions/download-artifact@v8
        with:
          name: morphir-scala-extension
          path: /tmp/morphir-scala-extension

      - name: Prepare Scala extension
        run: |
          echo "Listing downloaded artifact:"
          ls -R /tmp/morphir-scala-extension || true
          SCALA_BIN=$(find /tmp/morphir-scala-extension -name "native-executable" -type f | head -n 1)
          if [ -z "$SCALA_BIN" ]; then
            echo "::error::native-executable not found under /tmp/morphir-scala-extension"
            find /tmp/morphir-scala-extension -type f | head -n 20
            exit 1
          fi
          chmod +x "$SCALA_BIN"
          echo "SCALA_BIN=$SCALA_BIN" >> "$GITHUB_ENV"
          echo "Found Scala binary at: $SCALA_BIN"
          ls -la "$SCALA_BIN"
          VER_FILE=$(find /tmp/morphir-scala-extension -name "morphir-scala-version.txt" -type f | head -n 1)
          if [ -f "$VER_FILE" ]; then
            ver=$(cat "$VER_FILE")
            printf 'MORPHIR_SCALA_ELM_EXTENSION_VERSION=%s\n' "$ver" >> "$GITHUB_ENV"
            echo "Restored Scala version: $ver from $VER_FILE"
          fi

      - name: Set up Rust CI
        uses: ./.github/actions/setup-rust-ci

      - name: Run tests
        run: cargo test --locked --package morphir

      - name: Run the kit against the Rust binding
        run: mise run mck:run-rust

      - name: Upload the Rust binding's MCK report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mck-report-morphir-rust
          path: .dev/out/mck/morphir-rust.json

      - name: Validate migrated IR against the v4 schema
        run: mise run migrate:validate

      - name: Validate signed tool release metadata
        run: mise run ci:validate-tool-release-metadata

      - name: Build
        run: cargo build --locked --release --package morphir

      - name: Run Morphir Elm CLI integration tests
        env:
          MORPHIR_ELM_EXTENSION_BIN: >-
            ${{ github.workspace }}/ecosystem/morphir-elm/dist/morphir-elm-extension/morphir-elm-extension
        run: |
          cargo test --locked --package integration-tests --test elm_extension \
            -- --ignored --nocapture
          cargo test --locked --package morphir --test cli_integration \
            real_installed_morphir_elm_is_verified_and_activates_offline \
            -- --ignored --nocapture

      - name: Run Morphir Scala Elm CLI integration test
        env:
          MORPHIR_SCALA_ELM_EXTENSION_BIN: ${{ env.SCALA_BIN }}
        run: >-
          cargo test --locked --package morphir --test cli_integration
          real_installed_morphir_scala_elm_is_selected_and_activates_offline
          -- --ignored --exact --nocapture

      - name: Run CLI integration tests
        # integration-tests finds the CLI binary in target/release/morphir
        run: cargo test --locked --package integration-tests

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM extension guests
        # setup-rust-ci exports RUSTFLAGS for the mold linker; rust-lld
        # rejects -fuse-ld=mold for the wasm32 target.
        env:
          RUSTFLAGS: ""
        run: >-
          cargo build --locked --release
          --manifest-path ecosystem/morphir-rust/Cargo.toml
          -p morphir-avro-extension -p morphir-openapi-extension
          -p morphir-python-binding -p morphir-rust-binding
          --target wasm32-unknown-unknown

      - name: Run WASM extension integration tests
        run: >-
          cargo test --locked --package morphir
          --test generate_extension --test generate_openapi_extension
          -- --ignored --nocapture

      - name: Package and test the Python extension through the CLI
        env:
          MORPHIR_PYTHON_BUNDLE: ${{ github.workspace }}/.dev/out/python-bundle
        run: |
          python3 -B ecosystem/morphir-rust/scripts/package_extension.py \
            --short-id python \
            --wasm ecosystem/morphir-rust/target/wasm32-unknown-unknown/release/morphir_python_binding.wasm \
            --output "$MORPHIR_PYTHON_BUNDLE"
          cargo test --locked --package morphir --test python_extension -- --ignored --nocapture

      - name: Package and test the Rust extension through the CLI
        env:
          MORPHIR_RUST_BUNDLE: ${{ github.workspace }}/.dev/out/rust-bundle
        run: |
          python3 -B ecosystem/morphir-rust/scripts/package_extension.py \
            --short-id rust \
            --wasm ecosystem/morphir-rust/target/wasm32-unknown-unknown/release/morphir_rust_binding.wasm \
            --output "$MORPHIR_RUST_BUNDLE"
          cargo test --locked --package morphir --test rust_extension -- --ignored --nocapture

  # Generate and diff-check CLI reference docs — parallel with extension builds
  # and integration tests (only needs a debug morphir build, not extensions).
  check-cli-docs:
    name: Check CLI docs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Initialize environment
        run: mise run init -- --ci

      - name: Set up Rust CI
        uses: ./.github/actions/setup-rust-ci

      - name: Generate CLI docs
        run: mise run docs:cli

      - name: Check CLI docs are up to date
        run: |
          # --ignored=matching also surfaces generated outputs that a
          # .gitignore rule would silently keep out of the repository
          CHANGES=$(git status --porcelain --ignored=matching -- docs/cli docs/man completions)
          if [ -n "$CHANGES" ]; then
            echo "::error::Generated CLI documentation is out of date or untracked. Run 'mise run docs:cli' and commit the changes."
            echo "$CHANGES"
            git diff -- docs/cli docs/man completions
            exit 1
          fi

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.mck == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Initialize (CI mode)
        run: mise run init -- --ci

      - name: Validate schemas against the metaschema
        run: mise run schema:validate

      - name: Validate published examples
        run: mise run examples:validate

      - name: Validate the tracked IR fixtures
        run: mise run fixtures:validate

      - name: Check the naming conformance corpus is current
        run: mise run fixtures:naming-corpus-check

      - name: Check the format-version conformance corpus and its vendored copy agree
        run: mise run fixtures:format-version-corpus-check

      - name: Run the Bun specification tooling tests
        run: mise run tools:test

      - name: Website IR conformance runner
        run: mise run website:test-ir-storage-profiles

      - name: Check the Morphir Compatibility Kit
        run: mise run mck:check

      - name: Check kit fences against the v4 schemas
        run: mise run mck:schema-check

      - name: Run the kit against the TypeScript binding
        run: mise run mck:run

      - name: Validate draft package schemas and examples
        run: mise run package:schema-check

      - name: Run the MCK package suite through the shared TypeScript core
        run: mise run package:check

      - name: Upload MCK reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mck-reports
          path: .dev/out/mck

  package-mck:
    name: MCK package compatibility (TypeScript + Rust)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.package-mck == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - name: Cache Rust adapter build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ecosystem/morphir-rust -> target
          shared-key: package-mck
      - name: Install integration test types
        run: bun install --frozen-lockfile
        working-directory: tools
      - name: Check integration tooling
        id: integration
        run: |
          bun run --cwd tools typecheck
          bun test tools/rust-mck-command.test.ts tools/package-ci.test.ts
      - name: Run TypeScript package implementation
        run: mise run package:check
      - name: Check synthetic restore assurance preflight vectors
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: mise run package:assurance-check
      - name: Run independent Rust package implementation
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: mise run package:check:rust
      - name: Run TypeScript package resolution implementation
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: mise run package:resolution-check
      - name: Run independent Rust package resolution implementation
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: mise run package:resolution-check:rust
      - name: Upload package compatibility reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mck-package-implementations
          path: .dev/out/mck/package-*.json
          if-no-files-found: error

  release-workflow:
    name: Release workflow
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate release workflow
        run: python3 -B -m unittest discover -s tests/ci

  check:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [changes, lint, build-elm-extension, build-scala-extension, morphir-cli-test, check-cli-docs, docs, release-workflow, desktop-demo, package-mck]
    if: always()
    steps:
      - name: Check results
        run: |
          # Check if rust jobs were required and passed
          if [[ "${{ needs.changes.outputs.rust }}" == "true" ]]; then
            if [[ "${{ needs.lint.result }}" != "success" ]]; then
              echo "lint failed (result: ${{ needs.lint.result }})"
              exit 1
            fi
            if [[ "${{ needs.build-elm-extension.result }}" != "success" ]]; then
              echo "build-elm-extension failed (result: ${{ needs.build-elm-extension.result }})"
              exit 1
            fi
            if [[ "${{ needs.build-scala-extension.result }}" != "success" ]]; then
              echo "build-scala-extension failed (result: ${{ needs.build-scala-extension.result }})"
              exit 1
            fi
            if [[ "${{ needs.morphir-cli-test.result }}" != "success" ]]; then
              echo "morphir-cli-test failed (result: ${{ needs.morphir-cli-test.result }})"
              exit 1
            fi
            if [[ "${{ needs.check-cli-docs.result }}" != "success" ]]; then
              echo "check-cli-docs failed (result: ${{ needs.check-cli-docs.result }})"
              exit 1
            fi
          fi
          # Check if docs job was required and passed
          if [[ "${{ needs.changes.outputs.docs }}" == "true" || "${{ needs.changes.outputs.mck }}" == "true" ]]; then
            if [[ "${{ needs.docs.result }}" != "success" ]]; then
              echo "docs failed"
              exit 1
            fi
          fi
          if [[ "${{ needs.changes.outputs.release }}" == "true" ]]; then
            if [[ "${{ needs.release-workflow.result }}" != "success" ]]; then
              echo "release workflow validation failed"
              exit 1
            fi
          fi
          if [[ "${{ needs.changes.outputs.desktop-demo }}" == "true" ]]; then
            if [[ "${{ needs.desktop-demo.result }}" != "success" ]]; then
              echo "Desktop demo tests failed"
              exit 1
            fi
          fi
          if [[ "${{ needs.changes.outputs.package-mck }}" == "true" ]]; then
            if [[ "${{ needs.package-mck.result }}" != "success" ]]; then
              echo "MCK package compatibility failed"
              exit 1
            fi
          fi
          echo "All required checks passed!"
