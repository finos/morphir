name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests each queued PR on top of main and the PRs ahead of it.
  merge_group:
  workflow_dispatch:

jobs:
  # Docs and project-site changes skip the long jobs below; lint, format-check and validate-config
  # always run. `site` builds and tests the project site when a site input changes. Pushes to main
  # and manual runs run every job; on main the Site workflow builds the site. The path rules are
  # in `scripts/ci-changes.mbtx`.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.detect.outputs.code }}
      site: ${{ steps.detect.outputs.site }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned MoonBit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise install http:moonbit
          moonbit_dir="$(mise where http:moonbit)"
          moonbit_version="$(mise current http:moonbit)"
          # The binary archive omits core; install the matching complete toolchain.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | \
            MOON_HOME="$moonbit_dir" bash -s -- "$moonbit_version"
          echo "$moonbit_dir/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$moonbit_dir" >> "$GITHUB_ENV"

      - name: Update Mooncakes registry
        run: moon update

      - name: Test the change rules
        run: moonx scripts/ci-changes.mbtx --self-test

      - name: Detect code changes
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" head="$PR_HEAD" ;;
            merge_group) base="$QUEUE_BASE" head="$QUEUE_HEAD" ;;
            push)
              # The Site workflow builds and deploys main.
              printf 'code=true\nsite=false\n' >> "$GITHUB_OUTPUT"
              echo "push runs every job; the Site workflow builds the site"
              exit 0
              ;;
            *)
              printf 'code=true\nsite=true\n' >> "$GITHUB_OUTPUT"
              echo "$EVENT runs every job"
              exit 0
              ;;
          esac
          moonx scripts/ci-changes.mbtx "$base" "$head" | tee changes.txt
          grep -E '^(code|site)=(true|false)$' changes.txt >> "$GITHUB_OUTPUT"
          test "$(grep -cE '^(code|site)=' changes.txt)" -eq 2

  supervision:
    name: Process supervision (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript
      - name: Test process lifecycle
        run: node apps/morphir/build-provider/test-supervision.mts

  embedding:
    name: Embedded Toolchain
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript
      - name: Test Node, npm and browser embedding
        run: |
          bun install --frozen-lockfile --cwd pkgs/morphir-host/embedding
          bun run --cwd pkgs/morphir-host/embedding build
          bun run --cwd pkgs/morphir-host/embedding test
          bun run --cwd pkgs/morphir-host/embedding playwright install --with-deps chromium
          bun run --cwd pkgs/morphir-host/embedding test:browser

  typescript:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-typescript
      - name: Install frozen package dependencies
        run: |
          bun install --frozen-lockfile --cwd apps/morphir-workbench
          bun install --frozen-lockfile --cwd apps/morphir-site
          bun install --frozen-lockfile --cwd pkgs/morphir-host/embedding
          bun install --frozen-lockfile --cwd pkgs/morphir-elm/scripts
      - name: Check every TypeScript project
        run: bun check --all
      - name: Prove checker and checked builds reject invalid types
        run: bun run test:types

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/share/mise/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          mise --version
          mise install
          echo "MOON_HOME=$(mise where http:moonbit)" >> "$GITHUB_ENV"
          # Fix permissions for MoonBit binaries (http backend doesn't set +x)
          echo "Fixing MoonBit binary permissions..."
          chmod +x "$HOME/.local/share/mise/installs/http-moonbit"/*/bin/moon* || true
          chmod +x "$HOME/.local/share/mise/installs/http-moonbit"/*/bin/internal/moonrun || true
          ls -la "$HOME/.local/share/mise/installs/http-moonbit"/*/bin/

      - name: Run linting
        run: mise run lint

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/share/mise/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          mise --version
          mise install
          echo "MOON_HOME=$(mise where http:moonbit)" >> "$GITHUB_ENV"
          # Fix permissions for MoonBit binaries (http backend doesn't set +x)
          echo "Fixing MoonBit binary permissions..."
          chmod +x "$HOME/.local/share/mise/installs/http-moonbit"/*/bin/moon* || true
          chmod +x "$HOME/.local/share/mise/installs/http-moonbit"/*/bin/internal/moonrun || true
          ls -la "$HOME/.local/share/mise/installs/http-moonbit"/*/bin/

      - name: Check formatting
        run: mise run lint:moonbit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, lint, format-check]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    strategy:
      matrix:
        target: [wasm, wasm-gc, js]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pinned MoonBit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise install http:moonbit
          moonbit_dir="$(mise where http:moonbit)"
          moonbit_version="$(mise current http:moonbit)"
          # The binary archive omits core; install the matching complete toolchain.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | \
            MOON_HOME="$moonbit_dir" bash -s -- "$moonbit_version"
          echo "$moonbit_dir/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$moonbit_dir" >> "$GITHUB_ENV"

      - name: Report MoonBit version
        run: moon version --all

      - name: Update Mooncakes registry
        run: moon update

      - name: Build ${{ matrix.target }}
        run: moon build --target ${{ matrix.target }} --release

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript

      - name: Smoke-test CLI for ${{ matrix.target }}
        run: bun run --cwd apps/morphir test ${{ matrix.target }}

      - name: Install workbench browser dependencies
        if: matrix.target == 'js'
        run: moonx scripts/typescript-tooling.mbtx setup-workbench --ci

      - name: Test shared workbench and connected protocol
        if: matrix.target == 'js'
        run: moonx scripts/typescript-tooling.mbtx test-workbench

      - name: Upload ${{ matrix.target }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            _build/${{ matrix.target }}/release/build/morphir/morphir/morphir.*
            apps/morphir/dist/morphir.js
            pkgs/morphir-host/runners/wasm.mjs
          if-no-files-found: error

  native-qualification:
    permissions:
      contents: read
      attestations: read
    name: Native qualification (${{ matrix.os }})
    needs: [changes, lint, format-check]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    uses: ./.github/workflows/ci-native.yml
    with:
      runner: ${{ matrix.os }}

  # The Elm and Scheme checks compile their own programs and do not use the output of the native
  # build, so they run beside `build` instead of after the native leg's steps.
  elm-scheme:
    name: Elm and Scheme end to end
    runs-on: ubuntu-latest
    needs: [changes, lint, format-check]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pinned MoonBit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise install http:moonbit
          moonbit_dir="$(mise where http:moonbit)"
          moonbit_version="$(mise current http:moonbit)"
          # The binary archive omits core; install the matching complete toolchain.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | \
            MOON_HOME="$moonbit_dir" bash -s -- "$moonbit_version"
          echo "$moonbit_dir/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$moonbit_dir" >> "$GITHUB_ENV"

      - name: Report MoonBit version
        run: moon version --all

      - name: Update Mooncakes registry
        run: moon update

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript

      - name: Check generated Elm projects with elm make
        run: mise run test:elm

      - name: Check the Elm parity corpus is fresh
        run: |
          mise run elm:parity-refresh
          git diff --exit-code -- pkgs/morphir-elm/conformance pkgs/morphir-engine/acceptance/elm

      - name: Check the workbench samples are fresh
        run: |
          mise run workbench:samples
          changes="$(git status --porcelain -- apps/morphir-workbench/assets/samples)"
          if [ -n "$changes" ]; then
            echo "The workbench samples are stale (changed, missing or untracked files):"
            echo "$changes"
            echo "Run 'mise run workbench:samples' and commit the result."
            exit 1
          fi

      - name: Scheme with inference to MoonBit and Elm
        run: |
          mise run e2e:scheme-moonbit
          mise run e2e:scheme-elm

      - name: Elm through the engine to MoonBit and Elm
        run: |
          mise run e2e:elm-moonbit
          mise run e2e:elm-elm

      - name: Check the SDK specification
        run: mise run sdk-spec:check

  installed-lifecycle:
    name: Installed lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes, lint, format-check]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript
      - name: Install pinned complete MoonBit toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise install http:moonbit
          moonbit_dir="$(mise where http:moonbit)"
          moonbit_version="$(mise current http:moonbit)"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | \
            MOON_HOME="$moonbit_dir" bash -s -- "$moonbit_version"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$moonbit_dir/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$moonbit_dir" >> "$GITHUB_ENV"
      - name: Resolve pinned workspace packages
        run: moon update && moon build --target js
      - name: Acquire required isolated LLVM pin
        if: runner.os == 'macOS'
        env:
          MORPHIR_LLVM_HOME: ${{ github.workspace }}/.dev/llvm-toolchain
          MORPHIR_LLVM_PIN: ${{ github.workspace }}/.dev/llvm-pin.json
        run: mise run setup:llvm
      - name: Installed JS, Wasm GC and native C debug/release acceptance
        if: runner.os != 'macOS'
        env:
          MORPHIR_REQUIRED_TARGETS: js,wasm-gc,native
          MORPHIR_INSTALLED_RECEIPTS: .dev/installed-ci
        run: mise run test:installed-lifecycle
      - name: Installed required LLVM and other lanes debug/release acceptance
        if: runner.os == 'macOS'
        env:
          MORPHIR_REQUIRED_TARGETS: js,wasm-gc,native,llvm
          MORPHIR_LLVM_HOME: ${{ github.workspace }}/.dev/llvm-toolchain
          MORPHIR_LLVM_PIN: ${{ github.workspace }}/.dev/llvm-pin.json
          MORPHIR_INSTALLED_RECEIPTS: .dev/installed-ci
        run: mise run test:installed-lifecycle
      - name: Qualify owned native Workbench workers without CEF
        run: mise run test:workbench-native-workers
      - name: Qualify read-only native Workbench workspace grants without CEF
        run: mise run test:workbench-native-workspaces
      - name: Retain installed identity and comparison receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-lifecycle-${{ matrix.os }}
          path: |
            .dev/installed-ci/
            .dev/llvm-pin.json
          if-no-files-found: error

  native-telemetry:
    name: Native telemetry (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes, lint, format-check]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript
      - name: Install pinned complete MoonBit toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise install http:moonbit
          moonbit_dir="$(mise where http:moonbit)"
          moonbit_version="$(mise current http:moonbit)"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | \
            MOON_HOME="$moonbit_dir" bash -s -- "$moonbit_version"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$moonbit_dir/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$moonbit_dir" >> "$GITHUB_ENV"
      - name: Resolve pinned workspace packages
        run: moon update && moon build --target js
      - name: Build native adapter from accepted archive pins
        env:
          MORPHIR_OTEL_OUTPUT: .dev/native-otel
        run: mise run setup:native-otel
      - name: Installed OTLP capture, bounded flush and overhead baseline
        env:
          MORPHIR_OTEL_BINARY: .dev/native-otel/morphir-otel
          MORPHIR_OTEL_PIN: .dev/native-otel/pin.json
          MORPHIR_TELEMETRY_RECEIPTS: .dev/telemetry-ci
        run: mise run test:native-telemetry
      - name: Retain telemetry capture and baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-telemetry-${{ matrix.os }}
          path: |
            .dev/telemetry-ci/
            .dev/native-otel/pin.json
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes, lint, format-check]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    strategy:
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pinned MoonBit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise install http:moonbit
          moonbit_dir="$(mise where http:moonbit)"
          moonbit_version="$(mise current http:moonbit)"
          # The binary archive omits core; install the matching complete toolchain.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | \
            MOON_HOME="$moonbit_dir" bash -s -- "$moonbit_version"
          echo "$moonbit_dir/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$moonbit_dir" >> "$GITHUB_ENV"

      - name: Report MoonBit version
        run: moon version --all

      - name: Update Mooncakes registry
        run: moon update

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Set up Bun and portable runtime JavaScript
        uses: ./.github/actions/setup-typescript

      - name: Run tests
        run: moon test --target ${{ matrix.target }}

  # Moved from validate-config.yml, which ran only when configuration paths changed. A required
  # check from a path-filtered workflow stays pending on every other PR, so this job always runs
  # (it takes under a minute) and ci-ok covers it.
  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/site-build.yml

  validate-config:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/share/mise/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          mise --version
          mise install

      # validate:packages is a MoonBit script (moonx), so it needs the complete pinned toolchain.
      - name: Install pinned MoonBit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mise install http:moonbit
          moonbit_dir="$(mise where http:moonbit)"
          moonbit_version="$(mise current http:moonbit)"
          # The binary archive omits core; install the matching complete toolchain.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | \
            MOON_HOME="$moonbit_dir" bash -s -- "$moonbit_version"
          echo "$moonbit_dir/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$moonbit_dir" >> "$GITHUB_ENV"

      - name: Update Mooncakes registry
        run: moon update

      - name: List available tasks
        run: mise run list-tasks

      - name: Validate configuration
        run: mise run validate

  # The only check that branch protection and the merge queue require, so job renames and matrix
  # changes need no settings change. Add every new job to `needs`.
  #
  # `if: always()` is required: without it this job is skipped when a needed job fails, and
  # GitHub counts a skipped required check as passed. A needed job that is skipped (a job with
  # an `if:` condition, or one whose dependency failed) passes here; the failed dependency still
  # fails this job. Failed and cancelled jobs fail it.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - site
      - supervision
      - typescript
      - embedding
      - lint
      - format-check
      - validate-config
      - build
      - native-qualification
      - elm-scheme
      - installed-lifecycle
      - native-telemetry
      - test
    steps:
      - name: Check that every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Some CI jobs did not pass"
            echo "$failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
