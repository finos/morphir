name: Release

# The official Morphir CLI release. The CLI source is finos/morphir-dotnet,
# pinned as ecosystem/morphir-dotnet; that source's own build produces every
# artifact (`--target PackRelease`). This workflow orchestrates it, launches
# each produced artifact on its own platform, and publishes one release whose
# manifest names the exact source commit, kit digest and artifact digests.
# .config/cli-release.json holds the expectations; tools/cli-release.ts does
# the checks; tools/cli-release.test.ts tests both and this workflow.
#
# Releases of the deleted Rust CLI used `v*` tags. Those tags and their
# releases stay as they are: this workflow only runs for `cli/v*`, refuses a
# tag whose release already exists, and never uploads into a release.

on:
  push:
    tags:
      - 'cli/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing official CLI tag to release (for example, cli/v0.4.0-alpha.4)'
        required: true
        type: string

permissions:
  contents: read

# One release run per tag at a time. A second run for the same tag waits; a
# release that is building or publishing is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release-info:
    name: Validate release tag and source pin
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check out the pinned CLI source
        run: git submodule update --init --depth 1 ecosystem/morphir-dotnet

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install tooling dependencies
        run: bun install --frozen-lockfile
        working-directory: tools

      - name: Validate the tag against the pinned source
        id: release
        run: bun run tools/cli-release.ts release-info --tag "$RELEASE_TAG"

  pack-tool:
    name: Pack Morphir.Tool
    needs: release-info
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-info.outputs.tag }}
          persist-credentials: false

      - name: Check out the pinned CLI source
        run: git submodule update --init --recursive --depth 1 ecosystem/morphir-dotnet

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install tooling dependencies
        run: bun install --frozen-lockfile
        working-directory: tools

      - name: Verify the source pin
        run: bun run tools/cli-release.ts verify-source

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: ecosystem/morphir-dotnet/global.json

      # The source's own release profile: the same pack as its PackTool
      # target, so the package id, the dotnet-morphir command and `dotnet
      # morphir` stay what they are.
      - name: Pack the tool package
        working-directory: ecosystem/morphir-dotnet
        run: dotnet run --project build/_build.csproj -- --target PackRelease --deployment dotnet-tool

      - name: Upload the tool package
        uses: actions/upload-artifact@v7
        with:
          name: cli-dotnet-tool
          path: |
            ecosystem/morphir-dotnet/artifacts/release/*.nupkg
            ecosystem/morphir-dotnet/artifacts/release/*.build-launch.json
            ecosystem/morphir-dotnet/artifacts/release/*.build-contents.json
          if-no-files-found: error
          retention-days: 7

  build-platform:
    name: Build and qualify (${{ matrix.rid }})
    needs: [release-info, pack-tool]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-info.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Windows Git paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-info.outputs.tag }}
          persist-credentials: false

      - name: Check out the pinned CLI source
        run: git submodule update --init --recursive --depth 1 ecosystem/morphir-dotnet

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install tooling dependencies
        run: bun install --frozen-lockfile
        working-directory: tools

      - name: Verify the source pin
        run: bun run tools/cli-release.ts verify-source

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: ecosystem/morphir-dotnet/global.json

      # Native AOT compiles only on the operating system it targets, so each
      # platform builds on its own runner. The source's build checks that each
      # publish folder matches its launch metadata before it packs.
      - name: Build the platform offerings
        working-directory: ecosystem/morphir-dotnet
        run: |
          set -euo pipefail
          dotnet run --project build/_build.csproj -- --target PackRelease --deployment native-aot --rid ${{ matrix.rid }}
          dotnet run --project build/_build.csproj -- --target PackRelease --deployment self-contained --rid ${{ matrix.rid }}
          dotnet run --project build/_build.csproj -- --target PackRelease --deployment framework-dependent --rid ${{ matrix.rid }}

      - name: Download the tool package
        uses: actions/download-artifact@v8
        with:
          name: cli-dotnet-tool
          path: .dev/out/cli-release/tool

      # Each artifact is launched as users launch it: the extracted executable
      # or apphost itself (never `dotnet exec`), and the tool as
      # `dotnet-morphir` and `dotnet morphir`. Standalone offerings run with no
      # .NET on the search path.
      - name: Qualify the produced artifacts
        env:
          VERSION: ${{ needs.release-info.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          OUT=.dev/out/cli-release/qualification
          RELEASE=ecosystem/morphir-dotnet/artifacts/release
          for deployment in native-aot self-contained framework-dependent; do
            bun run tools/cli-release.ts qualify --release-dir "$RELEASE" --deployment "$deployment" --rid "$RID" \
              --platform "$RID" --version "$VERSION" --out "$OUT/$deployment-$RID.qualification.json"
          done
          bun run tools/cli-release.ts qualify --release-dir .dev/out/cli-release/tool --deployment dotnet-tool \
            --platform "$RID" --version "$VERSION" --out "$OUT/dotnet-tool-$RID.qualification.json"

      - name: Upload the platform artifacts and their qualification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.rid }}
          path: |
            ecosystem/morphir-dotnet/artifacts/release/*.zip
            ecosystem/morphir-dotnet/artifacts/release/*.tar.gz
            ecosystem/morphir-dotnet/artifacts/release/*.build-launch.json
            ecosystem/morphir-dotnet/artifacts/release/*.build-contents.json
            ecosystem/morphir-dotnet/artifacts/release/size-report.md
            .dev/out/cli-release/qualification/*.qualification.json
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish the GitHub release
    needs: [release-info, pack-tool, build-platform]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-info.outputs.tag }}
      VERSION: ${{ needs.release-info.outputs.version }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-info.outputs.tag }}
          persist-credentials: false

      - name: Check out the pinned CLI source
        run: git submodule update --init --depth 1 ecosystem/morphir-dotnet ecosystem/morphir-rust

      - name: Refuse a release that already exists
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. A published release is never replaced; tag a new version."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install tooling dependencies
        run: bun install --frozen-lockfile
        working-directory: tools

      # The kit digest the manifest records is the shared runner's own kit
      # identity (`morphir-mck kit status`), not a second hashing scheme.
      - name: Identify the compatibility kit
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          mkdir -p .dev/out/cli-release
          cargo +1.98.1 run --locked -q -p morphir-mck-cli -- kit status --kit spec/ir/mck --json > .dev/out/cli-release/kit-status.json

      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          path: .dev/out/cli-release/assets
          pattern: cli-*

      # Maintainer decision of 9 November 2026: future legacy names
      # (morphir-<rid>[.exe], morphir-<rid>-v<version>.tar.gz) carry the same
      # bytes as the qualified Native AOT executable. They are copied from the
      # packed native-aot archive, not built again, and are not an offering.
      - name: Derive the legacy names from the Native AOT executable
        run: |
          bun run tools/cli-release.ts legacy-aliases --assets .dev/out/cli-release/assets \
            --version "$VERSION" --out .dev/out/cli-release/legacy

      - name: Write the release manifest
        run: |
          bun run tools/cli-release.ts manifest --tag "$TAG" --version "$VERSION" \
            --assets .dev/out/cli-release/assets --kit-status .dev/out/cli-release/kit-status.json \
            --legacy .dev/out/cli-release/legacy/legacy-aliases.json --out .dev/out/cli-release/publish

      # One create call with every asset, the legacy names among them. The tag
      # must already exist (it is never created here), and nothing is uploaded
      # into a release afterwards.
      - name: Create the release
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=(.dev/out/cli-release/assets/*/*.zip .dev/out/cli-release/assets/*/*.tar.gz .dev/out/cli-release/assets/*/*.nupkg)
          ASSETS+=(.dev/out/cli-release/legacy/morphir-*)
          ASSETS+=(.dev/out/cli-release/publish/release-manifest.json)
          PRERELEASE=()
          if [ "${{ needs.release-info.outputs.prerelease }}" = "true" ]; then PRERELEASE=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "Morphir CLI $VERSION" --notes-file .dev/out/cli-release/publish/release-notes.md "${PRERELEASE[@]}" "${ASSETS[@]}"
