name: Release

# The official Morphir CLI release. The CLI source is finos/morphir-dotnet,
# pinned as ecosystem/morphir-dotnet. That source's own reusable workflows, at
# the pinned commit, build every artifact: cli-offering.yml each offering with
# its maintained release profiles, and morphirup-build.yml the morphirup
# toolchain manager and, on each toolchain platform, the setup toolchain, whose
# acquired setup journey it runs on the produced archives. This workflow then
# launches every artifact again on each platform as users do, assembles the
# morphirup checksum files with the source's own build targets, and publishes
# one release whose manifest names the exact source commit, kit digest and
# artifact digests. The morphirup and toolchain assets keep the names a
# finos/morphir-dotnet release of the same version gives them. .config/cli-release.json holds the
# expectations; tools/cli-release.ts does the checks; tools/cli-release.test.ts
# tests both and this workflow.
#
# Official CLI releases use `v<version>` tags (maintainer decision, 10 November
# 2026), the namespace the deleted Rust CLI's releases used. Those tags and their
# releases stay as they are. A new release must be newer than every existing
# v* tag and never reuse one; the workflow refuses a tag whose release already
# exists and never uploads into a release. While any publication gate blocks
# (a candidate pin, unreleased source, a source tag elsewhere, an old version),
# it builds and qualifies but refuses to publish.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Official CLI tag to release, v<version>. Dispatch from that tag; a dry run may be dispatched from a branch before the tag exists.'
        required: true
        type: string
      dry-run:
        description: 'Build, qualify and write the release evidence without creating a release'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# One release run per ref and tag at a time. A second run for the same tag waits;
# a release that is building or publishing is never cancelled. The ref keeps a
# dry run dispatched from a branch out of the tag's group, so a queued rehearsal
# can never replace a pending release of that tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # A tag push publishes; a dispatch is a dry run unless dry-run is explicitly false.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}

jobs:
  release-info:
    name: Validate release tag and source pin
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      matrix: ${{ steps.release.outputs.matrix }}
      offerings: ${{ steps.release.outputs.offerings }}
      morphirup: ${{ steps.release.outputs.morphirup }}
      publishable: ${{ steps.release.outputs.publishable }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      # A dry run dispatched from a branch rehearses the release before its tag exists, at the branch's commit.
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/') && env.RELEASE_TAG || github.sha }}
          persist-credentials: false

      - name: Check out the pinned CLI source
        run: git submodule update --init --depth 1 ecosystem/morphir-dotnet

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install tooling dependencies
        run: bun install --frozen-lockfile
        working-directory: tools

      # Refuses a run whose workflow ref is not refs/tags/<tag> (or, for a dry run only, a branch), whose checkout is
      # not the tag's (or the branch's triggering) commit, or whose literal cli-offering.yml commit differs from the
      # pin. Later jobs check out the commit it outputs.
      - name: Validate the tag, the run's ref and the pinned source
        id: release
        run: bun run tools/cli-release.ts release-info --tag "$RELEASE_TAG"

  # The source's own build, one job per offering and platform. `uses` must name
  # the commit literally, and `ref` passes the same commit; the release tests
  # check both against .config/cli-release.json. Native AOT compiles only on
  # its own operating system, so each runner is the platform's own.
  offering:
    name: Build ${{ matrix.deployment }} ${{ matrix.rid }}
    needs: release-info
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-info.outputs.offerings) }}
    uses: finos/morphir-dotnet/.github/workflows/cli-offering.yml@318b1bfd1722d36f6c51a6c95d85b4d84f6623e7
    with:
      repository: finos/morphir-dotnet
      ref: 318b1bfd1722d36f6c51a6c95d85b4d84f6623e7
      deployment: ${{ matrix.deployment }}
      rid: ${{ matrix.rid }}
      os: ${{ matrix.runner }}
      configuration: Release

  # morphirup, the toolchain manager, built by the source's own workflow at the
  # pinned commit on each morphirup platform's runner. On a toolchain platform
  # (.config/cli-release.json morphirup.toolchainPlatforms) the same job packs the
  # setup toolchain, runs the source's acquired setup journey on the archives it
  # produced, and uploads its self-contained host as that platform's
  # self-contained offering (morphir-dotnet-self-contained-<rid>). The candidate,
  # the bundle and SHA256SUMS name those bytes, so offering above does not build
  # self-contained there. `uses` and `ref` name the pin, as for cli-offering.yml.
  morphirup:
    name: Build morphirup ${{ matrix.rid }}
    needs: release-info
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-info.outputs.morphirup) }}
    uses: finos/morphir-dotnet/.github/workflows/morphirup-build.yml@318b1bfd1722d36f6c51a6c95d85b4d84f6623e7
    with:
      repository: finos/morphir-dotnet
      ref: 318b1bfd1722d36f6c51a6c95d85b4d84f6623e7
      rid: ${{ matrix.rid }}
      os: ${{ matrix.runner }}
      configuration: Release
      toolchain: true
      upload-host-offering: true
      retention-days: 7

  # Each artifact is launched as users launch it, on its platform: the
  # extracted executable or apphost itself (never `dotnet exec`), and the tool
  # as `dotnet-morphir` and `dotnet morphir`. Standalone offerings run with no
  # .NET on the search path. This is the parent's qualification; the source
  # workflow's start check is not.
  qualify-platform:
    name: Qualify (${{ matrix.rid }})
    needs: [release-info, offering, morphirup]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-info.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Windows Git paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Check out the bound commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-info.outputs.commit }}
          persist-credentials: false

      - name: Check out the pinned CLI source
        run: git submodule update --init --depth 1 ecosystem/morphir-dotnet

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install tooling dependencies
        run: bun install --frozen-lockfile
        working-directory: tools

      - name: Verify the source pin
        run: bun run tools/cli-release.ts verify-source

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: ecosystem/morphir-dotnet/global.json

      # Each offering's artifact is flat: the archive or package, its launch
      # metadata, its contents listing and its .sha256.
      - name: Download this platform's offerings
        uses: actions/download-artifact@v8
        with:
          pattern: morphir-dotnet-*-${{ matrix.rid }}
          path: .dev/out/cli-release/offerings
          merge-multiple: true

      - name: Download the tool package
        uses: actions/download-artifact@v8
        with:
          name: morphir-dotnet-dotnet-tool-any
          path: .dev/out/cli-release/tool

      - name: Qualify the produced artifacts
        env:
          VERSION: ${{ needs.release-info.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          OUT=.dev/out/cli-release/qualification
          for deployment in native-aot self-contained framework-dependent; do
            bun run tools/cli-release.ts qualify --release-dir .dev/out/cli-release/offerings --deployment "$deployment" --rid "$RID" \
              --platform "$RID" --version "$VERSION" --out "$OUT/$deployment-$RID.qualification.json"
          done
          bun run tools/cli-release.ts qualify --release-dir .dev/out/cli-release/tool --deployment dotnet-tool \
            --platform "$RID" --version "$VERSION" --out "$OUT/dotnet-tool-$RID.qualification.json"

      # The manager as users run it: the downloaded executable itself, with no
      # .NET on the search path, and the same bytes inside its archive.
      - name: Download this platform's morphirup
        if: matrix.morphirup
        uses: actions/download-artifact@v8
        with:
          name: morphirup-${{ matrix.rid }}
          path: .dev/out/cli-release/morphirup

      - name: Qualify morphirup
        if: matrix.morphirup
        env:
          VERSION: ${{ needs.release-info.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          bun run tools/cli-release.ts qualify-morphirup --dir .dev/out/cli-release/morphirup --rid "$RID" \
            --version "$VERSION" --out ".dev/out/cli-release/qualification/$RID.morphirup-qualification.json"

      # .dev is a hidden folder, which upload-artifact leaves out unless told.
      - name: Upload the qualification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-qualification-${{ matrix.rid }}
          path: .dev/out/cli-release/qualification/*qualification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The source's own release assembly, in a job of its own: read-only
  # permissions and no token, because it runs the source's build (a NuGet
  # restore and the build's code). It hands the flattened assets to
  # publish-release as an artifact.
  assemble-morphirup:
    name: Assemble the morphirup and toolchain assets
    needs: [release-info, morphirup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-info.outputs.version }}
    steps:
      - name: Check out the bound commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-info.outputs.commit }}
          persist-credentials: false

      - name: Check out the pinned CLI source
        run: git submodule update --init --depth 1 ecosystem/morphir-dotnet
      # morphirup-<rid>: the manager, its archive and the notices.
      # windows-release-toolchain-<rid>: a toolchain platform's complete setup
      # toolchain with its producer's SHA256SUMS.
      - name: Download the morphirup outputs
        uses: actions/download-artifact@v8
        with:
          pattern: morphirup-*
          path: .dev/out/cli-release/morphirup-downloads/morphirup

      - name: Download the setup toolchains
        uses: actions/download-artifact@v8
        with:
          pattern: windows-release-toolchain-*
          path: .dev/out/cli-release/morphirup-downloads/windows-toolchain

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: ecosystem/morphir-dotnet/global.json

      # The source's own release assembly, run from the pinned checkout: each
      # toolchain is checked against its producer's SHA256SUMS, every output is
      # flattened once (FlattenReleaseAssets refuses two different files under
      # one name), and morphirup-v<version>.sha256 and the one SHA256SUMS over
      # the toolchains are written. sha256sum then reads both back as a user does.
      - name: Assemble the morphirup and toolchain assets
        run: |
          set -euo pipefail
          DOWNLOADS="$PWD/.dev/out/cli-release/morphirup-downloads"
          OUT="$PWD/.dev/out/cli-release/morphirup-assets"
          for dir in "$DOWNLOADS"/windows-toolchain/windows-release-toolchain-*; do
            (cd "$dir" && sha256sum -c SHA256SUMS)
          done
          cd ecosystem/morphir-dotnet
          ./build.sh --target FlattenReleaseAssets MorphirupChecksums WindowsToolchainChecksums \
            --release-asset-sources "$DOWNLOADS"/morphirup/* "$DOWNLOADS"/windows-toolchain/* \
            --windows-toolchain-sources "$DOWNLOADS"/windows-toolchain/* \
            --release-assets-dir "$OUT"
          cd "$OUT"
          sha256sum -c "morphirup-v${VERSION}.sha256"
          sha256sum -c SHA256SUMS

      - name: Upload the assembled assets
        uses: actions/upload-artifact@v7
        with:
          name: cli-morphirup-release-assets
          path: .dev/out/cli-release/morphirup-assets/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish-release:
    name: Publish the GitHub release
    needs: [release-info, offering, morphirup, qualify-platform, assemble-morphirup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The token is given only to the two steps that call gh; no other step,
    # and nothing it runs (bun install, cargo), has it in its environment.
    env:
      TAG: ${{ needs.release-info.outputs.tag }}
      VERSION: ${{ needs.release-info.outputs.version }}
    steps:
      - name: Check out the bound commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-info.outputs.commit }}
          persist-credentials: false

      - name: Check out the pinned CLI source
        run: git submodule update --init --depth 1 ecosystem/morphir-dotnet ecosystem/morphir-rust

      - name: Refuse a release that already exists
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. A published release is never replaced; tag a new version."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install tooling dependencies
        run: bun install --frozen-lockfile
        working-directory: tools

      # The kit digest the manifest records is the shared runner's own kit
      # identity (`morphir-mck kit status`), not a second hashing scheme.
      - name: Identify the compatibility kit
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          mkdir -p .dev/out/cli-release
          cargo +1.98.1 run --locked -q -p morphir-mck-cli -- kit status --kit spec/ir/mck --json > .dev/out/cli-release/kit-status.json

      # The offerings (morphir-dotnet-*) and the qualification (cli-qualification-*),
      # each in a folder of its own name. The morphirup outputs stay apart: a
      # toolchain holds a copy of its host archive, which is already an offering.
      - name: Download the offerings
        uses: actions/download-artifact@v8
        with:
          pattern: morphir-dotnet-*
          path: .dev/out/cli-release/assets

      - name: Download the qualification
        uses: actions/download-artifact@v8
        with:
          pattern: cli-qualification-*
          path: .dev/out/cli-release/assets

      # Assembled by assemble-morphirup, flat: every morphirup and toolchain asset and both checksum files.
      - name: Download the morphirup and toolchain assets
        uses: actions/download-artifact@v8
        with:
          name: cli-morphirup-release-assets
          path: .dev/out/cli-release/morphirup-assets

      # Maintainer decision of 9 November 2026: future legacy names
      # (morphir-<rid>[.exe], morphir-<rid>-v<version>.tar.gz) carry the same
      # bytes as the qualified Native AOT executable. They are copied from the
      # packed native-aot archive, not built again, and are not an offering.
      - name: Derive the legacy names from the Native AOT executable
        run: |
          bun run tools/cli-release.ts legacy-aliases --assets .dev/out/cli-release/assets \
            --version "$VERSION" --out .dev/out/cli-release/legacy

      # Refuses a candidate pin, a missing or failed qualification, or an
      # artifact whose bytes or release differ from its launch metadata. It
      # writes the exact asset list the create step attaches.
      - name: Write the release manifest
        env:
          COMMIT: ${{ needs.release-info.outputs.commit }}
        run: |
          DRY=()
          if [ "$DRY_RUN" = "true" ]; then DRY=(--dry-run); fi
          bun run tools/cli-release.ts manifest --tag "$TAG" --version "$VERSION" --commit "$COMMIT" \
            --assets .dev/out/cli-release/assets --kit-status .dev/out/cli-release/kit-status.json \
            --legacy .dev/out/cli-release/legacy/legacy-aliases.json --morphirup .dev/out/cli-release/morphirup-assets \
            --out .dev/out/cli-release/publish "${DRY[@]}"

      # The evidence of every run, dry or not: the manifest (with its publication record), the notes, the asset list,
      # the legacy names and the two checksum files. Only these files, named explicitly.
      - name: Upload the release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-release-evidence
          path: |
            .dev/out/cli-release/publish/release-manifest.json
            .dev/out/cli-release/publish/release-notes.md
            .dev/out/cli-release/publish/*-assets.txt
            .dev/out/cli-release/legacy/legacy-aliases.json
            .dev/out/cli-release/morphirup-assets/morphirup-v*.sha256
            .dev/out/cli-release/morphirup-assets/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      # One create call with every listed asset. The tag must already exist (it
      # is never created here), and nothing is uploaded into a release afterwards.
      - name: Create the release
        if: env.DRY_RUN != 'true' && needs.release-info.outputs.publishable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t ASSETS < .dev/out/cli-release/publish/release-assets.txt
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::The release manifest listed no assets."
            exit 1
          fi
          PRERELEASE=()
          if [ "${{ needs.release-info.outputs.prerelease }}" = "true" ]; then PRERELEASE=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "Morphir CLI $VERSION" --notes-file .dev/out/cli-release/publish/release-notes.md "${PRERELEASE[@]}" "${ASSETS[@]}"
