<svg xmlns="http://www.w3.org/2000/svg" width="780" height="230" viewBox="0 0 780 230" role="img" aria-labelledby="title desc">
  <title id="title">Activation is the final publication step</title>
  <desc id="desc">From a verified bootstrap, morphirup resolves an exact setup plan, acquires and verifies the artifacts, probes the staged candidate and only then activates the generation. A failure at plan, acquire or probe keeps the previous generation active; verified downloads can be reused, but a partial selection never becomes active.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs>
  <rect width="780" height="230" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#172554" font-size="15">
    <rect x="12" y="30" width="130" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="77" y="56" font-weight="700">Verified</text><text x="77" y="76">bootstrap</text>
    <rect x="166" y="30" width="135" height="60" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="233" y="56" font-weight="700">Resolve exact</text><text x="233" y="76">setup plan</text>
    <rect x="325" y="30" width="135" height="60" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="392" y="56" font-weight="700">Acquire</text><text x="392" y="76">and verify</text>
    <rect x="484" y="30" width="135" height="60" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="551" y="56" font-weight="700">Probe staged</text><text x="551" y="76">candidate</text>
    <rect x="643" y="30" width="125" height="60" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="705" y="56" font-weight="700">Activate</text><text x="705" y="76">generation</text>
    <rect x="96" y="140" width="592" height="56" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="392" y="165" font-weight="700">Any failure: keep the previous generation</text>
    <text x="392" y="186">Verified downloads can be reused; partial selections never become active</text>
    <g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M142 60 H160"/><path d="M301 60 H319"/><path d="M460 60 H478"/><path d="M619 60 H637"/>
    </g>
    <g fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)">
      <path d="M233 90 V134"/><path d="M392 90 V134"/><path d="M551 90 V134"/>
    </g>
  </g>
</svg>