<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
  <title id="title">Delivery dependencies stay explicit</title>
  <desc id="desc">Deployment profiles and acquisition, this change, and the WASM host, a separate change, both lead to packaged WASM qualification. Packaged WASM qualification and the readers and sessions of the bounded-access change both lead to the bounded generation large-package gate. F# process acquisition can ship before the WASM engine.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs>
  <rect width="760" height="230" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#172554" font-size="16">
    <rect x="10" y="20" width="210" height="65" rx="10" fill="#172554"/><text x="115" y="49" font-weight="700" fill="#ffffff">Profiles + acquisition</text><text x="115" y="71" fill="#ffffff">This change</text>
    <rect x="10" y="125" width="210" height="65" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="115" y="154" font-weight="700">WASM host</text><text x="115" y="176">Separate change</text>
    <rect x="290" y="20" width="205" height="65" rx="10" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="392" y="49" font-weight="700">Packaged WASM</text><text x="392" y="71">Qualification</text>
    <rect x="290" y="125" width="205" height="65" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="392" y="154" font-weight="700">Readers + sessions</text><text x="392" y="176">Bounded-access change</text>
    <rect x="550" y="20" width="200" height="65" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="650" y="49" font-weight="700">Bounded generation</text><text x="650" y="71">Large-package gate</text>
    <g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M220 52 H284"/><path d="M220 150 L284 76"/><path d="M495 52 H544"/><path d="M495 150 L544 76"/>
    </g>
    <text x="380" y="216" font-size="14" fill="#475569">F# process acquisition can ship before the WASM engine. The large-package WASM gate still needs both.</text>
  </g>
</svg>