---
extends: default
ignore: |
  .dev/
  # Byte-frozen inputs exercise original formatting, BOM and CRLF handling.
  apps/morphir-workbench/fixtures/headless-parity/v1/originals/

rules:
  line-length:
    max: 120
    level: warning
  indentation:
    spaces: 2
  comments:
    min-spaces-from-content: 1
  document-start: disable
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
