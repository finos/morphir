# Mise configuration for Morphir Moonbit monorepo
# This file defines the tools and configurations needed for development

[tools]
# Bun for TypeScript checks and application builds
bun = "1.4.4"

# Node.js and npm for the CLI package and target smoke tests
node = "24.22.0"

# C compiler and archiver for reproducible Linux/macOS CI cross-builds.
zig = "0.17.0"

# YAML linting
yamllint = "latest"

# GitHub Actions expressions, reusable workflow contracts and embedded shell.
actionlint = "1.7.12"

# Python package manager
uv = "latest"

# Moonbit toolchain, pinned. mise cannot resolve "latest" for an http: tool, and a
# pinned version keeps CI and every machine on the same compiler. To move to a
# newer release, change the version here and in each URL (with "+" written
# as "%2B"), taken from https://cli.moonbitlang.com/binaries/<version>/.

[tools."http:moonbit"]
version = "0.10.16+b1a0e846e"
bin_path = "bin"
# The archive alone has no core or moonx. Complete Unix installs the same way
# locally and in CI, using the upstream installer and the exact mise version.
# The upstream Unix installer supports Linux x64/ARM64 and Apple Silicon.
postinstall = """
{% if os() != "windows" %}
bash -c 'set -euo pipefail; export PATH="$MISE_TOOL_INSTALL_PATH/bin:$PATH"; curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOON_HOME="$MISE_TOOL_INSTALL_PATH" bash -s -- "$MISE_TOOL_VERSION"'
{% else %}
pwsh -NoProfile -File "{{config_root}}/tools/bootstrap-moonbit-windows.ps1"
{% endif %}
"""

[tools."http:moonbit".platforms]
linux-x64 = { url = "https://cli.moonbitlang.com/binaries/0.10.16%2Bb1a0e846e/moonbit-linux-x86_64.tar.gz" }
linux-arm64 = { url = "https://cli.moonbitlang.com/binaries/0.10.16%2Bb1a0e846e/moonbit-linux-aarch64.tar.gz" }
macos-arm64 = { url = "https://cli.moonbitlang.com/binaries/0.10.16%2Bb1a0e846e/moonbit-darwin-aarch64.tar.gz" }
windows-x64 = { url = "https://cli.moonbitlang.com/binaries/0.10.16%2Bb1a0e846e/moonbit-windows-x86_64.zip", format = "zip" }

[env]
# Environment variables for the project
_.path = ["./node_modules/.bin"]
MOON_HOME = { value = "{{ tools['http:moonbit'].path }}", tools = true }

[tasks."setup:core"]
description = "Verify the pinned MoonBit toolchain's own core (no override)"
run = ["moon update", "moon run scripts/moonbit-core.mbtx setup"]
run_windows = [
  'pwsh -NoProfile -File "{{config_root}}/tools/bootstrap-moonbit-windows.ps1" -ToolchainHome "{{ tools["http:moonbit"].path }}"',
  "moon update",
  "moon run scripts/moonbit-core.mbtx setup",
]

[tasks."check:core"]
description = "Verify the toolchain core's source bytes and exact decimal parsing"
run = ["moon run scripts/moonbit-core.mbtx check", "moon run scripts/moonbit-core.mbtx --self-test", "moon run tests/fixtures/core-pin/decimal.mbtx --target wasm-gc"]

[tasks."build"]
description = "Build all packages for all targets"
run = "moonx scripts/repository-tasks.mbtx build"

[tasks."build:wasi"]
description = "Build all packages for WASI target"
run = "moonx scripts/repository-tasks.mbtx build:wasi"

[tasks."build:browser"]
description = "Build all packages for browser (WASM-GC) target"
run = "moonx scripts/repository-tasks.mbtx build:browser"

[tasks."build:js"]
description = "Build all packages for JavaScript"
run = "moonx scripts/repository-tasks.mbtx build:js"

[tasks."build:native"]
description = "Build all packages as native executables"
run = "moonx scripts/repository-tasks.mbtx build:native"

[tasks."test"]
description = "Run tests for all packages"
run = "moonx scripts/repository-tasks.mbtx test"

[tasks."format"]
description = "Format Moonbit code"
run = "moonx scripts/repository-tasks.mbtx format"

[tasks."lint"]
description = "Run all linting tasks"
run = "moonx scripts/repository-tasks.mbtx lint"

[tasks."lint:moonbit"]
description = "Check Moonbit code formatting"
run = "moonx scripts/repository-tasks.mbtx lint:moonbit"

[tasks."lint:yaml"]
description = "Lint YAML files in the repository"
run = "moonx scripts/repository-tasks.mbtx lint:yaml"

[tasks."validate"]
description = "Run all validation checks"
run = "moonx scripts/repository-tasks.mbtx validate"

[tasks."clean"]
description = "Clean build artifacts"
run = "moonx scripts/repository-tasks.mbtx clean"

[tasks."list-tasks"]
description = "List all available mise tasks"
run = "moonx scripts/repository-tasks.mbtx list-tasks"

[tasks."ir:fixtures"]
description = "Regenerate pinned IR fixture tests; optionally refresh from local upstream clones"
run = "moonx scripts/refresh-ir-fixtures.mbtx"

[tasks."setup:hooks"]
description = "Setup git hooks for pre-push validation (idempotent)"
run = "moonx scripts/setup-hooks.mbtx"

[tasks."beads:plan"]
description = "Store specs, plans and ledgers in beads using the pinned upstream bd-plan"
run = "moonx scripts/beads-plan.mbtx"

[tasks.check]
description = "Run lint, CI policy tests, workspace tests and builds"
run = "moonx scripts/check.mbtx"

[tasks."package:codec-adapter"]
description = "Package production Workbench codecs into Wasm and Ion execution artifacts"
run = "moonx scripts/package-codec-adapter.mbtx"

[tasks."test:codec-adapter-mck"]
description = "Qualify saved codec adapters on Node and Chromium with the selected shared MCK"
run = "moonx scripts/codec-adapter-mck.mbtx"

[tasks."test:ci"]
description = "Test focused CI selection and fail-closed aggregate gates"
env.CI_EVIDENCE_JSON_TARGET = "wasm"
run = [
  "bun tools/test-ci-json-presentation.ts",
  "bun test tools/json-acquisition-results.test.ts",
  "bun test tools/packaged-host-command-json.test.ts",
  "bun apps/morphir/scripts/test-developer-json-presentation.ts",
  "bun apps/morphir/scripts/test-ci-evidence-json-presentation.ts",
  "actionlint",
  "moon run scripts/moonbit-core.mbtx --self-test",
  "moon fmt --check scripts/ci-changes.mbtx scripts/ci-gate.mbtx scripts/ci-measure.mbtx scripts/check.mbtx scripts/beads-companion.mbtx scripts/ci-mise-impact.mbtx scripts/ci-reuse.mbtx scripts/ci-platforms.mbtx scripts/ci-breach.mbtx scripts/ci-evidence.mbtx",
  "moonx scripts/ci-changes.mbtx --self-test",
  "moonx scripts/ci-mise-impact.mbtx --self-test",
  "moonx scripts/ci-gate.mbtx --self-test",
  "moonx scripts/ci-reuse.mbtx --self-test",
  "moonx scripts/ci-platforms.mbtx --self-test",
  "moonx scripts/ci-platforms.mbtx --expect-guarded \"$(moonx scripts/ci-gate.mbtx --qualification-jobs)\"",
  "moonx scripts/ci-breach.mbtx --self-test",
  "moonx scripts/ci-evidence.mbtx --self-test",
  "moonx scripts/ci-measure.mbtx --self-test",
  "moonx scripts/beads-companion.mbtx --self-test",
  "moonx scripts/headless-host.mbtx --self-test",
  "moon test scripts/artifact-client-source.mbtx",
  "moonx scripts/mck-release.mbtx --self-test",
  "moon fmt --check scripts/repository-tasks.mbtx scripts/refresh-ir-fixtures.mbtx scripts/setup-hooks.mbtx scripts/pre-push.mbtx scripts/beads-plan.mbtx",
  "moonx scripts/repository-tasks.mbtx --self-test",
  "moonx scripts/refresh-ir-fixtures.mbtx --self-test",
  "moonx scripts/setup-hooks.mbtx --self-test",
  "moonx scripts/pre-push.mbtx --self-test",
  "moonx scripts/beads-plan.mbtx --self-test",
  "bun tools/build-command-json.test.ts",
  "bun tools/portable-command-json.test.ts",
]

[tasks."ci:measure"]
description = "Measure completed Actions run queue, execution, runner and step costs"
run = "moonx scripts/ci-measure.mbtx"

[tasks."ci:changes"]
description = "Select focused CI jobs from the GitHub event and exact commits"
run = "moonx scripts/ci-changes.mbtx --event"

[tasks."ci:platforms"]
description = "Fail when a merge-path CI job can get a macOS runner"
run = "moonx scripts/ci-platforms.mbtx"

[tasks."ci:gate"]
description = "Require every selected CI job to pass"
run = "moonx scripts/ci-gate.mbtx"

[tasks."ci:gate:receipt"]
description = "Require every selected CI job to pass, then write the CI receipt"
run = "moonx scripts/ci-gate.mbtx --receipt .dev/ci/receipt.json"

[tasks."beads:check"]
description = "Check that this checkout or worktree uses the bootstrapped shared beads database"
# A MoonBit script, so one file works on every platform; see AGENTS.md (Task scripts).
run = "moonx scripts/beads-check.mbtx"

[tasks."beads:companion"]
description = "Inspect, store and export rich bead designs or capture durable knowledge"
run = "moonx scripts/beads-companion.mbtx"

[tasks."test:beads-companion"]
description = "Check rich-design preservation without opening a beads database"
run = "moonx scripts/beads-companion.mbtx --self-test"

[tasks."build:ci-native"]
description = "Cross-build the CI CLI for linux-x64 or darwin-arm64 with pinned Zig"
run = "moonx scripts/ci-native-build.mbtx"

[tasks."validate:packages"]
description = "Verify package structure is valid"
# A MoonBit script, so one file works on every platform; see AGENTS.md (Task scripts).
run = "moonx scripts/validate-packages.mbtx"

[tasks."test:workbench-live-host"]
description = "Opt-in browser acceptance against an existing Rust Morphir UI binary"
run = "moonx scripts/workbench-live-host.mbtx"

[tasks."test:workbench-artifacts"]
description = "Opt-in connected artifact downloads against an installed-process host fixture"
run = "moonx scripts/typescript-tooling.mbtx test-workbench-artifacts"

[tasks."test:workbench-artifact-client-mck"]
description = "Qualify artifact client lifecycle traces through the shared Rust MCK"
run = "moonx scripts/workbench-artifact-client-mck.mbtx"

[tasks."test:workbench-native-session"]
description = "Test native desktop session authority without CEF"
run = "moonx scripts/workbench-native-session.mbtx"

[tasks."test:workbench-native-workers"]
description = "Qualify bounded owned native Workbench workers without CEF"
run = "moonx scripts/workbench-native-workers.mbtx"

[tasks."test:workbench-native-workspaces"]
description = "Qualify read-only native grants, containment and captured bytes without CEF"
run = "moonx scripts/workbench-native-workspaces.mbtx"

[tasks."test:conformance"]
description = "Independent, Scheme and explicit Rust evaluator conformance gates"
run = "moon run scripts/conformance-check.mbtx"

[tasks."test:moonbit-frontend"]
description = "Compare original Boolean MoonBit models, Scheme and generated libraries"
run = "moon run scripts/moonbit-frontend-check.mbtx"

[tasks."build:extension"]
description = "Build the native MoonBit MEP backend"
run = "moon run scripts/moonbit-extension.mbtx build"

[tasks."bundle:extension"]
description = "Bundle the MoonBit guest using an explicit canonical host and target"
run = "moon run scripts/moonbit-extension.mbtx bundle"

[tasks."test:typed-source"]
description = "Qualify mixed typed libraries and String source consumers"
run = "moon run scripts/typed-source-check.mbtx"

[tasks."test:mep-process"]
description = "Qualify MEP stdio; add explicit host/digest/target pins for installed acceptance"
run = "moon run scripts/moonbit-extension.mbtx test"

[tasks."package:mep-extension"]
description = "Package the portable MoonBit MEP extension as saved Wasm and Ion"
run = "moonx scripts/package-mep-extension.mbtx"

[tasks."test:portable-mep"]
description = "Qualify the fresh saved MEP process and generated source consumer"
run = "moonx scripts/portable-mep-check.mbtx"

[tasks."test:portable-mep-mck"]
description = "Run and recheck the independent pinned shared MEP guest suite"
run = "moonx scripts/portable-mep-mck.mbtx"

[tasks."test:portable-mep-cli"]
description = "Run the saved MEP guest through the primary CLI extension command"
run = "moonx scripts/portable-mep-cli.mbtx"

[tasks."sdk-spec:generate"]
description = "Regenerate pkgs/morphir-sdk-spec/sdk_data.mbt from pkgs/morphir-sdk-spec/sdk.scm"
run = "moon run scripts/sdk-spec-generate.mbtx"

[tasks."sdk-spec:check"]
description = "Check pkgs/morphir-sdk-spec/sdk.scm against bindings.json, and check that sdk_data.mbt is fresh"
run = "moon run scripts/sdk-spec-check.mbtx"

[tasks."scheme-docs:generate"]
description = "Regenerate the Scheme docs example tests from the morphir-scheme README.mbt.md chapters"
run = "moon run scripts/scheme-docs-generate.mbtx"

[tasks."scheme-docs:check"]
description = "Check that the Scheme docs example tests match the morphir-scheme README.mbt.md chapters"
run = "moon run scripts/scheme-docs-check.mbtx"

[tasks."test:elm"]
description = "Check generated Elm projects with elm make"
run = "moon run scripts/elm-make-check.mbtx"

[tasks."elm:parity-refresh"]
description = "Run pinned morphir-elm make on the Elm parity projects and regenerate parity_data_wbtest.mbt"
run = "moon run scripts/elm-parity-refresh.mbtx"

[tasks."workbench:samples"]
description = "Regenerate the workbench Elm samples from the Elm corpus"
run = "moon run scripts/workbench-samples.mbtx"

[tasks."e2e:scheme-moonbit"]
description = "Scheme with inference fill to MoonBit: moon build accepts the libraries"
run = "moon run scripts/scheme-moonbit-check.mbtx"

[tasks."e2e:scheme-elm"]
description = "Scheme with inference fill to Elm: elm make accepts the projects"
run = "moon run scripts/scheme-elm-check.mbtx"

[tasks."e2e:elm-moonbit"]
description = "Elm projects through the engine to MoonBit: moon build accepts the libraries"
run = "moon run scripts/elm-moonbit-check.mbtx"

[tasks."e2e:elm-elm"]
description = "Elm projects through the engine to Elm: elm make accepts the projects"
run = "moon run scripts/elm-elm-check.mbtx"

[tasks."setup:llvm"]
description = "Acquire the hash-pinned darwin/arm64 LLVM toolchain separately"
run = "moon run scripts/llvm-setup.mbtx"

[tasks."setup:native-otel"]
description = "Build the optional native OTLP adapter from accepted archive pins"
run = "moon run scripts/native-otel-setup.mbtx"

[tasks."test:installed-lifecycle"]
description = "Installed npm lifecycle across required targets and supported input formats"
run = "moon run scripts/installed-lifecycle-check.mbtx"

[tasks."test:native-telemetry"]
description = "Installed native OTLP capture and paired instrumentation baseline"
run = "moon run scripts/native-telemetry-check.mbtx"

[tasks."test:installed-provider"]
description = "Qualify installed npm/native authenticated providers against the explicit pinned Rust checkout"
run = "moon run scripts/installed-provider-check.mbtx"

[tasks."test:workbench-mck"]
description = "Opt-in JSON/Ion value and invocation admission through the shared parent Rust MCK"
run = "moon run scripts/workbench-mck.mbtx"

[tasks."test:workbench-capability-policy-mck"]
description = "Opt-in runtime capability checks through the shared exact draft.12 MCK in Node, Chromium and native"
run = "moonx scripts/workbench-capability-policy-mck.mbtx"

[tasks."test:workbench-capability-execution-mck"]
description = "Opt-in immutable Scheme execution traces through the shared exact draft.19 Rust MCK"
run = "moonx scripts/workbench-capability-execution-mck.mbtx"

[tasks."test:workbench-selected-scheme-mck"]
description = "Opt-in selected public Scheme planning and unused-declaration witness through the shared Rust MCK"
run = "moonx scripts/workbench-selected-scheme-mck.mbtx"

[tasks."test:workbench-native-client-mck"]
description = "Opt-in production native client scenarios in Node and Chromium through the shared Rust MCK"
run = "moonx scripts/workbench-native-client-mck.mbtx"

[tasks."test:workbench-native-owner-mck"]
description = "Opt-in production native owner lifecycle through the shared Rust MCK"
run = "moonx scripts/workbench-native-owner-mck.mbtx"

[tasks."test:workbench-native-policy-mck"]
description = "Opt-in exact native checking-policy boundary and owner qualification through the shared Rust MCK"
run = "moonx scripts/workbench-native-policy-mck.mbtx"

[tasks."test:workbench-native-policy-client-mck"]
description = "Opt-in exact native checking-policy client qualification in Node and Chromium"
run = "moonx scripts/workbench-native-policy-client-mck.mbtx"

[tasks."test:workbench-http-policy-mck"]
description = "Opt-in exact HTTP checking-policy boundary qualification through the shared Rust MCK"
run = "moonx scripts/workbench-http-policy-mck.mbtx"

[tasks."test:workbench-http-policy-client-mck"]
description = "Opt-in exact HTTP checking-policy client qualification in Node and Chromium"
run = "moonx scripts/workbench-http-policy-client-mck.mbtx"

[tasks."test:workbench-http-policy-provider-mck"]
description = "Opt-in real authenticated HTTP checking-policy provider and worker qualification"
run = "moonx scripts/workbench-http-policy-provider-mck.mbtx"

[tasks."setup:site"]
description = "Install site build dependencies and Chromium for the smoke test"
run = "moonx scripts/typescript-tooling.mbtx setup-site"

[tasks."build:site"]
description = "Build the project site into _site/ (SITE_MAIN=1 fails on draft pages)"
run = "bun --check apps/morphir-site/scripts/build.ts"

[tasks."dev:site"]
description = "Serve _site/ at http://127.0.0.1:4173/morphir-moonbit/ and rebuild on content changes"
depends = ["build:site"]
run = "bun --check apps/morphir-site/scripts/serve.ts --watch"

[tasks."test:site"]
description = "Site unit tests, highlight tests and the browser smoke test against _site/"
run = [
  "moon test --target native -p finos/morphir-site/model finos/morphir-site/content finos/morphir-site/views finos/morphir-site/site finos/morphir-site/generate finos/morphir-site/check",
  "moon test --target js -p finos/morphir-site/model",
  "bun run --cwd apps/morphir-site test",
  "bun run --cwd apps/morphir-site test:browser",
]

[hooks]
# Automatically setup git hooks when entering the directory
enter = ["mise run setup:core", "mise run setup:hooks"]
postinstall = "mise run setup:core"

[settings]
# Enable experimental features
experimental = true

[tasks."check:site"]
description = "Check links, titles, the Atom feed and forbidden paths in the built _site/"
dir = "apps/morphir-site"
run = "moon run --target native check -- --dir ../../_site"

[tasks."setup:workbench"]
description = "Install Workbench dependencies and Chromium"
run = "moonx scripts/typescript-tooling.mbtx setup-workbench"

[tasks."build:workbench"]
description = "Build the shared browser Workbench"
run = "moonx scripts/typescript-tooling.mbtx build-workbench"

[tasks."workbench:artifact-source-check"]
description = "Verify the pinned upstream artifact client source and licenses"
run = "moonx scripts/artifact-client-source.mbtx check"

[tasks."test:workbench"]
description = "Test Workbench runtime and browser workflows"
run = "moonx scripts/typescript-tooling.mbtx test-workbench"

[tasks."check:workbench-package-pins"]
description = "Check package target and checksum refusals without downloading CEF"
run = "moonx scripts/workbench-packaged-targets.mbtx --self-test"

[tasks."build:workbench-packaged"]
description = "Build the selected actual Linux or Windows host package; GUI acceptance remains separate"
run = "moonx scripts/workbench-packaged-targets.mbtx build"

[tasks."test:workbench-packaged"]
description = "Accept the actual built Linux or Windows package and its browser-worker fallback"
run = "moonx scripts/workbench-packaged-targets.mbtx accept"

[tasks."test:embedding"]
description = "Test Node, npm and browser embedding"
run = "moonx scripts/typescript-tooling.mbtx test-embedding"

[tasks."test:assembly"]
description = "Generate, assemble and independently load libraries with real SDK/core assets"
run = "moonx scripts/assembly-check.mbtx"

[tasks."setup:wasm-hosts"]
description = "Install the optional component qualification dependencies and Chromium"
run = "moonx scripts/wasm-host-check.mbtx setup"

[tasks."test:wasm-hosts"]
description = "Opt-in MoonBit component boundary checks in Wasmtime, Node and Chromium"
run = "moonx scripts/wasm-host-check.mbtx"

[tasks."test:compiler"]
description = "Compile libraries and validate private build leases"
run = "moonx scripts/typescript-tooling.mbtx test-compiler"

[tasks."test:supervision"]
description = "Verify owned process cleanup"
run = "moonx scripts/typescript-tooling.mbtx test-supervision"

[tasks."test:cli"]
description = "Smoke-test CLI targets and installed package"
run = "moonx scripts/typescript-tooling.mbtx test-cli"

[tasks."check:typescript"]
description = "Install frozen dependencies and check all TypeScript projects"
run = "moonx scripts/typescript-tooling.mbtx check"
