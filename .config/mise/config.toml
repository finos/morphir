# Morphir Development Tools Configuration
# This project contains:
# - Rust-based CLI tooling (crates/morphir)
# - Docusaurus website (website/)

[settings]
experimental = true

[tools]
# Core tools
rust = "1.98.1"
python = "3.14.7"

# JavaScript runtimes for website and tooling
node = "24.21.0"
bun = "1.4.2"
"npm:morphir-elm" = { version = "2.100.0", allow_low_downloads = true }

# Rust tools
"cargo:cargo-binstall" = "latest"

# JSON Schema CLI (https://github.com/sourcemeta/jsonschema)
jsonschema = "latest"

# CLI documentation generator (https://usage.jdx.dev/)
# Pinned: docs:cli commits generated output to docs/cli/ and completions/,
# and the freshness check in CI fails when a new usage release changes it.
usage = "6.11.0"

# ===== Initialization Tasks =====
[tasks.init]
description = "Initialize development environment. Use --ci for CI environments."
# Hook activation is a dependency rather than part of the body below, so it still
# runs on a Windows box without POSIX bash, where the body cannot (morphir-6y9z).
depends = ["hooks:install"]
run = """
#!/usr/bin/env bash
set -e

if [[ "$1" == "--ci" ]]; then
    # CI mode: shallow clone submodules for faster checkout
    echo "Initializing in CI mode (shallow submodules)..."
    git submodule update --init --recursive --depth 1
else
    # Development mode: full clone
    echo "Initializing development environment..."
    git submodule update --init --recursive
fi

# Long path support. An IR v4 document tree nests package, module and definition
# names, and the default path budget assumes long paths are available. On Windows
# two separate switches gate that, and both are off by default.
if [[ "$OSTYPE" == "msys" || "$OSTYPE" == "cygwin" || "$OSTYPE" == "win32" ]]; then
    if [[ "$(git config --get core.longpaths)" != "true" ]]; then
        echo ""
        echo "warning: git core.longpaths is not enabled."
        echo "  Git for Windows ships with it off, so a checkout fails past 260 characters"
        echo "  even when Windows itself allows long paths. Enable it with:"
        echo ""
        echo "    git config --global core.longpaths true"
        echo ""
        echo "  Windows also needs LongPathsEnabled, set once per machine as administrator:"
        echo ""
        echo "    Set-ItemProperty 'HKLM:\\\\SYSTEM\\\\CurrentControlSet\\\\Control\\\\FileSystem' \\\\"
        echo "      -Name LongPathsEnabled -Value 1"
        echo ""
        echo "  Without both, write document trees with the portable path budget:"
        echo "  set pathBudget to 200 in the distribution manifest. See docs/spec/draft/names.md."
    fi
fi
"""

# ===== Formatting Tasks =====
[tasks.fmt]
description = "Format all code"
depends = ["fmt:rust", "fmt:schema"]

[tasks."fmt:rust"]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks."fmt:schema"]
description = "Format JSON Schema files"
# The glob is expanded by the helper rather than by the shell, for the same
# reason `fmt-check:schema` below does it: `find | xargs` is not portable, and
# the default Windows shell carries neither, so `website:build-schemas` failed
# there after writing the regenerated JSON.
run = "bun run tools/jsonschema-glob.ts fmt website/static/schemas/*.json"

[tasks.fmt-check]
description = "Check all formatting"
depends = ["fmt-check:rust", "fmt-check:schema"]

[tasks."fmt-check:rust"]
description = "Check Rust code formatting"
run = "cargo fmt --all --check"

[tasks."fmt-check:schema"]
description = "Check JSON Schema formatting"
# The glob is expanded by the helper rather than by the shell: the default
# Windows shell expands nothing, and `find | xargs` is not a portable fallback
# because a Windows box may carry neither.
run = "bun run tools/jsonschema-glob.ts fmt --check website/static/schemas/*.json"

# ===== Linting Tasks =====
[tasks.lint]
description = "Run all linters"
depends = ["lint:rust", "lint:schema"]

[tasks."lint:rust"]
description = "Run Clippy linter"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."lint:schema"]
description = "Lint JSON Schema files"
# Rules the schemas do not satisfy yet are excluded so the task can gate
# `check`. Re-enable a rule by fixing its findings and deleting its line.
# The globs are expanded by the helper rather than by the shell; see
# `fmt-check:schema` above.
run = """
bun run tools/jsonschema-glob.ts lint website/static/schemas/*.yaml website/static/schemas/*.json \
  --exclude const_with_type \
  --exclude description_trailing_period \
  --exclude description_trim \
  --exclude empty_object_as_true \
  --exclude enum_to_const \
  --exclude enum_with_type \
  --exclude oneof_to_anyof_disjoint_types \
  --exclude orphan_definitions \
  --exclude required_properties_in_properties \
  --exclude simple_properties_identifiers \
  --exclude top_level_examples \
  --exclude unnecessary_allof_wrapper \
  --exclude valid_examples
"""

# ===== Validation Tasks =====
[tasks."examples:validate"]
description = "Validate documentation IR examples against their schemas"
run = "python .config/mise/tasks/examples/validate.py"

[tasks."fixtures:validate"]
description = "Validate fetched morphir-ir fixtures against their schemas (run fixtures:fetch first)"
run = "python .config/mise/tasks/fixtures/validate.py"

[tasks."schema:validate"]
description = "Validate schemas against metaschema"
# The glob is expanded by the script rather than by the shell: the default
# Windows shell does not expand "*.yaml", and bash is not a portable fallback
# because a Windows box may carry only the WSL launcher.
run = "bun run tools/validate-schemas.ts"

# Not part of `check`: website:build-schemas depends on website:install, whose
# npm postinstall rebuilds website/static/validation-inline.worker.js, and
# `check` installs no website dependencies today. CI runs it in the docs job.
[tasks."check:schemas-generated"]
description = "Regenerate the JSON schemas from their YAML sources and fail if any committed JSON differed"
run = "bun run tools/check-schemas-generated.ts"

[tasks."check:config-schema-sync"]
description = "Check morphir-rust embeds the generated configuration schema byte for byte"
run = "node website/scripts/check-config-schema-sync.js"

[tasks."mck:check"]
description = "Check MCK cases, schemas, protocol examples and IR fences with the native engine"
depends = ["mck:vocabulary-check"]
run = [
    "cargo run --locked -p morphir -- mck check spec/ir/mck",
    "cargo run --locked -p morphir -- mck schema check --kit spec/ir/mck",
]

[tasks."mck:vocabulary-check"]
description = "Check vocabulary generation against the pinned TypeScript IR model"
# Keep the semantic vocabulary authoring check; compatibility validation is native.
run = [
    "bun install --frozen-lockfile --cwd ecosystem/morphir-typescript",
    "bun run tools/gen-mck-vocabulary.ts --check",
]

[tasks."mck:vocabulary"]
description = "Regenerate spec/mck/vocabulary.json from the TypeScript IR binding's vocabulary"
run = [
    "bun install --frozen-lockfile --cwd ecosystem/morphir-typescript",
    "bun run tools/gen-mck-vocabulary.ts",
]

[tasks."mck:schema-check"]
description = "Validate MCK schemas, JSON and protocol examples, and accepted or rejected IR fences"
run = "cargo run --locked -p morphir -- mck schema check --kit spec/ir/mck"

[tasks."mck:run"]
description = "Run the native MCK against the TypeScript adapter and check its report and kit coverage"
run = [
    "bun install --frozen-lockfile --cwd ecosystem/morphir-typescript",
    "bun run tools/run-mck-gate.ts .dev/out/mck/morphir-typescript-adapter.json spec/ir/mck/allowed-failing.json spec/ir/mck bun ecosystem/morphir-typescript/packages/mck/src/adapter.ts",
    "cargo run --locked -p morphir -- mck coverage --kit spec/ir/mck",
]

[tasks."mck:run-rust"]
description = "Run the native MCK against the pinned Rust adapter and check its report and kit coverage"
# Native spawning resolves the .exe suffix on Windows.
run = [
    "cargo build --locked -p morphir-mck-adapter --manifest-path ecosystem/morphir-rust/Cargo.toml --target-dir ecosystem/morphir-rust/target",
    "bun run tools/run-mck-gate.ts .dev/out/mck/morphir-rust.json ecosystem/morphir-rust/crates/morphir-mck-adapter/allowed-failing.json spec/ir/mck ecosystem/morphir-rust/target/debug/mck-adapter-rust",
    "cargo run --locked -p morphir -- mck coverage --kit spec/ir/mck",
]

[tasks."migrate:validate"]
description = "Migrate the published v3 example to v4 and validate the output against the v4 JSON Schema"
# The validator is a website script, so it needs website/node_modules; `init`
# only checks out submodules.
depends = ["website:install"]
run = [
    "cargo run -p morphir -- migrate website/static/ir/examples/v3/greeting-example.json --output .dev/out/migrate/out.json",
    "node website/scripts/validate-migrated-ir.js .dev/out/migrate/out.json",
]

[tasks."package:schema-check"]
description = "Validate draft package schemas and example structures (not MCK package compatibility)"
run = [
    "jsonschema fmt spec/package/schemas --check",
    "jsonschema metaschema spec/package/schemas/library-manifest.schema.json",
    "jsonschema metaschema spec/package/schemas/lock-core.schema.json",
    "jsonschema metaschema spec/package/schemas/package-restore-assurance-protocol.schema.json spec/package/schemas/package-restore-assurance-report.schema.json",
    "jsonschema metaschema spec/package/schemas/package-protocol.schema.json spec/package/schemas/package-report.schema.json spec/package/schemas/package-resolution-protocol.schema.json spec/package/schemas/package-resolution-report.schema.json",
    "jsonschema metaschema spec/package/schemas/resolution-input.schema.json spec/package/schemas/resolution-result.schema.json spec/package/schemas/resolution-case.schema.json",
    "jsonschema validate spec/package/schemas/resolution-case.schema.json spec/package/mck/resolution-cases.json spec/package/mck/fixtures/resolution/basic.json spec/package/mck/fixtures/resolution/backtracking.json spec/package/mck/fixtures/resolution/updates.json spec/package/mck/fixtures/resolution/diagnostics.json spec/package/mck/fixtures/resolution/root-catalog.json spec/package/mck/fixtures/resolution/witness-ranking.json spec/package/mck/fixtures/resolution/validation-phases.json -r spec/package/schemas",
    "jsonschema validate spec/package/schemas/library-manifest.schema.json spec/package/mck/fixtures/two-libraries/eligibility/manifest.json spec/package/mck/fixtures/two-libraries/loan-rules/manifest.json",
    "jsonschema validate spec/package/schemas/lock-core.schema.json spec/package/mck/fixtures/two-libraries/lock-core.json -r spec/package/schemas",
    "jsonschema validate website/static/schemas/morphir-ir-v4.json spec/package/mck/fixtures/two-libraries/eligibility/ir.json spec/package/mck/fixtures/two-libraries/loan-rules/ir.json",
]

[tasks."package:definitions-check"]
description = "Inspect draft.3 candidate definitions and pending assets without executing restore"
run = [
    "cargo run --locked -p morphir -- mck package inspect --source . --contract 0.1.0-draft.3",
]

[tasks."package:fixture-check"]
description = "Reproduce frozen signed fixture bytes and verify them independently offline"
run = [
    "cargo test --locked -p morphir-mck --test package_fixture",
    "cargo run --locked -p morphir-mck --example package_fixture -- --source . --check spec/package/mck/fixtures/local-registry/assets/signed",
]

[tasks."package:assurance-check"]
description = "Check fixed synthetic restore assurance preflight vectors through native runtime support (not restore compatibility)"
run = [
    "cargo test --locked -p morphir --test package_runtime assurance_",
]

[tasks."package:publisher-check"]
description = "Check publisher-signature evidence and fixed decoder probes through native runtime support (not restore compatibility)"
run = [
    "cargo test --locked -p morphir --test package_runtime publisher_",
    "cargo test --locked -p morphir --test package_runtime decode_",
]

[tasks."package:check"]
description = "Run package integrity through native MCK against the TypeScript adapter"
run = [
    "bun install --frozen-lockfile --cwd ecosystem/morphir-typescript",
    "bun run tools/run-package-mck.ts typescript 0.1.0-draft.1",
]

[tasks."package:check:rust"]
description = "Run package integrity through native MCK against the independent Rust adapter"
run = [
    "cargo build --locked -p morphir-mck-adapter --manifest-path ecosystem/morphir-rust/Cargo.toml --target-dir ecosystem/morphir-rust/target",
    "bun run tools/run-package-mck.ts rust 0.1.0-draft.1",
]

[tasks."package:resolution-check"]
description = "Run package resolution through native MCK against the TypeScript adapter"
run = [
    "bun install --frozen-lockfile --cwd ecosystem/morphir-typescript",
    "bun run tools/run-package-mck.ts typescript 0.1.0-draft.2",
]

[tasks."package:resolution-check:rust"]
description = "Run package resolution through native MCK against the independent Rust adapter"
run = [
    "cargo build --locked -p morphir-mck-adapter --manifest-path ecosystem/morphir-rust/Cargo.toml --target-dir ecosystem/morphir-rust/target",
    "bun run tools/run-package-mck.ts rust 0.1.0-draft.2",
]

[tasks."package:mvp-restore-check"]
description = "Run the signed local Library MVP fresh-restore inventory through native MCK and the Rust adapter"
run = [
    "cargo build --locked -p morphir-mck-adapter --manifest-path ecosystem/morphir-rust/Cargo.toml --target-dir ecosystem/morphir-rust/target",
    "cargo run --locked -p morphir -- mck package mvp-run --source . --adapter ecosystem/morphir-rust/target/debug/mck-adapter-rust --adapter-arg package-mvp",
]

[tasks."hooks:install"]
description = "Activate the checked-in git hooks in .husky"
run = "bun run tools/install-git-hooks.ts"

[tasks."hooks:check"]
description = "Verify the git hooks are active"
run = "bun run tools/install-git-hooks.ts --check"

[tasks."beads:publish"]
description = "Publish the beads export to the beads-sync branch"
run = "bun run tools/publish-beads.ts"

[tasks."beads:drift-check"]
description = "Verify the beads database and the published export agree"
run = "bun run tools/check-beads-drift.ts"

# The generator imports only node: builtins, so bun runs it without an install.
# Only `tools:typecheck` needs tools/node_modules.
[tasks."fixtures:naming-corpus"]
description = "Generate the IR v4 name-encoding conformance corpus"
run = "bun run tools/gen-naming-corpus.ts"

[tasks."fixtures:naming-corpus-check"]
description = "Verify the name-encoding conformance corpus and its vendored copy are up to date"
run = "bun run tools/gen-naming-corpus.ts --check"

[tasks."fixtures:format-version-corpus-check"]
description = "Verify the format-version conformance corpus and its copy vendored into morphir-rust are byte-identical"
run = "bun run tools/check-vendored-fixture.ts docs/spec/ir/fixtures/format-version-conformance.json ecosystem/morphir-rust/tests/fixtures/format-version-conformance.json"

[tasks."fixtures:yaml-acceptance"]
description = "Regenerate the greeting-example YAML acceptance fixture from the reference writer"
run = [
    "cargo run -p morphir -- migrate website/static/ir/examples/v3/greeting-example.json --output .dev/out/migrate/greeting.v4.json",
    "bun run tools/gen-yaml-acceptance-fixture.ts .dev/out/migrate/greeting.v4.json crates/morphir/tests/fixtures/yaml/greeting-example.v4.yaml",
]

[tasks."fixtures:tree-acceptance"]
description = "Regenerate the greeting-example document-tree acceptance fixture from the reference writer"
# Both sides start from the same model: the CLI migrates the published v3
# example to v4 JSON, and the reference writer lays that same JSON out as a
# tree, so the fixture pins the layout rather than a migration difference.
run = [
    "cargo run -p morphir -- migrate website/static/ir/examples/v3/greeting-example.json --output .dev/out/migrate/greeting.v4.json",
    "bun run tools/gen-yaml-acceptance-fixture.ts --tree .dev/out/migrate/greeting.v4.json crates/morphir/tests/fixtures/tree/greeting-example",
]

[tasks."tools:install"]
description = "Install dependencies for the Bun specification tooling"
run = "bun install"
dir = "tools"

[tasks."tools:typecheck"]
description = "Type check the Bun specification tooling"
run = "bun run typecheck"
dir = "tools"
depends = ["tools:install"]

[tasks."tools:test"]
description = "Run the Bun specification tooling tests"
run = "bun test tools"
depends = ["tools:install"]

[tasks."vendor:morphir-web"]
description = "Build and vendor a clean morphir-web worktree twice with provenance"
run = "bun run tools/vendor-morphir-web.ts"

[tasks."demo:desktop"]
description = "Build, install and run the real Desktop demo in a fresh temporary Home"
usage = 'flag "--prepare-only" help="Build and install without opening Desktop"'
run = "bun run tools/demo-desktop.ts"

[tasks."test:desktop-demo"]
description = "Test Desktop demo orchestration without building or opening Desktop"
run = "bun test tools/demo-desktop.test.ts"

[tasks.check]
description = "Run all checks"
# mck:run is not part of check: it drives the TypeScript binding, so it
# needs the ecosystem/morphir-typescript submodule checked out and its
# dependencies installed. CI runs it as its own step in the docs job.
depends = [
    "fmt-check",
    "lint",
    "examples:validate",
    "fixtures:validate",
    "fixtures:naming-corpus-check",
    "fixtures:format-version-corpus-check",
    "schema:validate",
    "check:config-schema-sync",
    "mck:check",
    "package:schema-check",
    "tools:test",
]

# ===== Testing Tasks =====
[tasks."test:examples"]
description = "Run categorized notebook and Markdown example scenarios through the Morphir CLI"
run = "cargo run --locked --package morphir -- itest examples"

[tasks."examples:prepare-elm"]
description = "Stage a downloaded reference Elm extension for the CLI examples"
run = "bun run tools/prepare-elm-examples.ts"

[tasks."examples:prepare-backends"]
description = "Verify and stage pinned WASM bundles for the CLI backend examples"
run = "bun run tools/prepare-backend-examples.ts"

[tasks."test:itest"]
description = "Test the integration scenario driver and its real CLI acceptance cases"
run = [
    "cargo test --locked --package morphir --lib commands::itest",
    "cargo test --locked --package morphir --test itest --test notebook --test eval",
    "cargo test --locked --package morphir-evaluator --package morphir-opa",
]

[tasks.test]
description = "Run tests"
run = "cargo test --all-features --workspace"

[tasks.build]
description = "Build release"
run = "cargo build --release --workspace"

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

# ===== Website Tasks =====
[tasks."website:install"]
description = "Install website dependencies"
run = "npm install"
dir = "website"

[tasks."website:build-schemas"]
description = "Generate JSON schemas from YAML sources and format them"
# The converter's output is not in the committed style; formatting it here
# keeps a regenerated schema from showing up as a whole-file diff.
run = ["npm run build:schemas", "mise run fmt:schema"]
dir = "website"
depends = ["website:install"]

[tasks."website:build-worker"]
description = "Build the validation worker (bundles Ajv)"
run = "npm run build:worker"
dir = "website"
depends = ["website:install"]

[tasks."website:build"]
description = "Build the website for production"
# The schemas and the worker are built by the dependencies; `npm run build`
# would regenerate the schemas a second time without formatting them.
run = "npm run docusaurus -- build"
dir = "website"
depends = ["website:build-schemas", "website:build-worker"]

[tasks."website:dev"]
description = "Start website development server"
run = "npm run start"
dir = "website"
depends = ["website:build-schemas", "website:build-worker"]

[tasks."website:test-ir-storage-profiles"]
description = "Run the website's format-version and storage-profile conformance runner"
depends = ["website:install"]
dir = "website"
run = "npm run test:ir-storage-profiles"

[tasks."website:typecheck"]
description = "Run TypeScript type checking on website"
run = "npm run typecheck"
dir = "website"
depends = ["website:install"]

# ===== Ecosystem Build Tasks =====
[tasks."build:morphir-moonbit"]
description = "Build all MoonBit packages in morphir-moonbit"
run = "python .config/mise/tasks/ecosystem/build_morphir_moonbit.py"

[tasks."test:morphir-moonbit"]
description = "Run tests for all MoonBit packages in morphir-moonbit"
run = "python .config/mise/tasks/ecosystem/test_morphir_moonbit.py"

# ===== Submodule Tasks =====
[tasks."submodules:init"]
description = "Initialize and fetch all submodules (first-time or after clone without --recurse-submodules)"
run = "git submodule update --init --recursive"

[tasks."submodules:update"]
description = "Update each submodule to the commit recorded in the superproject"
run = "git submodule update --recursive"

[tasks."submodules:status"]
description = "Show submodule status (commit, branch, dirty state)"
run = "git submodule status"

[tasks."submodules:pull"]
description = "Pull latest in each submodule (superproject ref unchanged until you commit)"
run = "git submodule foreach 'git pull origin main'"

[tasks."submodules:add"]
description = "Add a new submodule under ecosystem/. Usage: mise run submodules:add -- <name> [url]"
run = "python .config/mise/tasks/submodules/add.py"

# ===== CI Tasks =====
[tasks."ci:fetch-published-bundles"]
description = "Download the pinned published extension bundles into .dev/out/published-bundles"
run = "bun run tools/fetch-published-bundles.ts"

[tasks."ci:validate-tool-release-metadata"]
description = "Validate signed tool release metadata fixtures"
run = "python .config/mise/tasks/ci/validate_tool_release_metadata.py"
