# Published WASM extension bundles that CI runs the CLI against.
#
# These are the bundles users install. A CLI change that breaks one of them turns CI red.
# Each bundle is downloaded from the releases of the repository that owns it. `repository` names
# that repository as `owner/name`; a pin without one comes from finos/morphir-rust.
# `sha256` is the digest of the guest `.wasm`. It is checked against the download, so a release
# asset that someone replaces does not run. For a deliberate protocol change, publish a compatible
# bundle from the repository that owns it first, then move the pin here in the same pull request
# as the CLI change.

[bundles.avro]
tag = "extension/avro/v0.2.0"
artifact = "morphir-avro-extension-0.2.0"
sha256 = "a13fb7ee85e7d6e0fbde51920043eeb2357ed8b9440452ae426ea70158226ff9"

[bundles.openapi]
tag = "extension/openapi/v0.2.0"
artifact = "morphir-openapi-extension-0.2.0"
sha256 = "ccef0ebcc8f4fff5579c5c28ee4cb44cdec46a6f4ec993a8e6ceb029996f5ec0"

# finos/morphir-python owns the Python extension. Bundles up to extension/python/v0.4.0 remain in
# the finos/morphir-rust releases.
[bundles.python]
repository = "finos/morphir-python"
tag = "extension/python/v0.4.1"
artifact = "morphir-python-binding-0.4.1"
sha256 = "a04722e16115667fc7c332177805dcb049aef563afcee0e5f80c5fea302f5b4e"

[bundles.rust]
tag = "extension/rust/v0.3.0"
artifact = "morphir-rust-binding-0.3.0"
sha256 = "b2f911d1b59a44d32a892e4aa3c6d3994399dcd14d58e58e97c9ed9076337912"

# A process extension is one executable per platform, released as an archive by the repository
# that owns it. CI runs on x86_64 Linux, so that archive is the one pinned. `sha256` is the digest
# of the archive.

[executables.elm]
repository = "finos/morphir-elm"
tag = "extension/elm/v0.4.1"
archive = "morphir-elm-extension-0.4.1-x86_64-unknown-linux-gnu.tgz"
sha256 = "4fcc97c70a060976f508c2eb58130fe84572cb1036f31a389f4030cc5b145e6b"
executable = "morphir-elm-extension"

# finos/morphir-scala releases morphir-scala-elm with its root v* release, as the executable
# itself and not as an archive, so the pin names an `asset`. The executable reports the release
# version as its provider version.

[executables.scala-elm]
repository = "finos/morphir-scala"
tag = "v0.5.0-M11"
asset = "morphir-scala-elm-linux-amd64-0.5.0-M11"
sha256 = "3dca4b3a5c9c94de845ed6b1901535d595ac04f3b1478215a3a4e2f022a885fe"
executable = "morphir-scala-elm"
