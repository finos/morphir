# Published finos/morphir-rust extension bundles that CI runs the CLI against.
#
# These are the bundles users install. A CLI change that breaks one of them turns CI red.
# `sha256` is the digest of the guest `.wasm`. It is checked against the download, so a release
# asset that someone replaces does not run. For a deliberate protocol change, publish a compatible bundle from finos/morphir-rust first,
# then move the pin here in the same pull request as the CLI change.

[bundles.avro]
tag = "extension/avro/v0.1.2"
artifact = "morphir-avro-extension-0.1.2"
sha256 = "dede68e224460d954bae495ffb6964d21bfa7e85f2446b7bfe4a62c491a51299"

[bundles.openapi]
tag = "extension/openapi/v0.1.1"
artifact = "morphir-openapi-extension-0.1.1"
sha256 = "817dddbd06da52a7f5139c03c012bbdc31a0ea64958e2b09224aa73d8f9733ff"

[bundles.python]
tag = "extension/python/v0.3.0"
artifact = "morphir-python-binding-0.3.0"
sha256 = "3a00b3c40aa0885da8bbe118724f10ae002ad26d1f81f41451094d39b23fbe03"

[bundles.rust]
tag = "extension/rust/v0.2.0"
artifact = "morphir-rust-binding-0.2.0"
sha256 = "d8136a4d045ba615f6da201ad26561b14452d6cca17976e0f53b23022b4968a0"

# A process extension is one executable per platform, released as an archive by the repository
# that owns it. CI runs on x86_64 Linux, so that archive is the one pinned. `sha256` is the digest
# of the archive.

[executables.elm]
repository = "finos/morphir-elm"
tag = "extension/elm/v0.4.0"
archive = "morphir-elm-extension-0.4.0-x86_64-unknown-linux-gnu.tgz"
sha256 = "61ae93ea47ea56599144bfe17ebeb33fede6c957800aa82f5ccb3c8b6780837e"
executable = "morphir-elm-extension"

# finos/morphir-scala releases morphir-scala-elm with its root v* release, as the executable
# itself and not as an archive, so the pin names an `asset`. The executable reports the release
# version as its provider version.

[executables.scala-elm]
repository = "finos/morphir-scala"
tag = "v0.5.0-M09"
asset = "morphir-scala-elm-linux-amd64-0.5.0-M09"
sha256 = "bada31034ee96602505eca7390bfbf3cd92759391e7cdb16c2e860dcb9758ecc"
executable = "morphir-scala-elm"
