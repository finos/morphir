  start from this file: copy it, keep the <head> and the CSS as they are, and write the content inside <main><h1>Controlled HTTP checking-policy client qualification</h1><p class="meta">Exact Workbench MCK 0.1.0-draft.24</p><nav class="toc" aria-label="Contents"><ul><li><a href="#scope">Scope</a></li><li><a href="#input">Closed inputs</a></li><li><a href="#projection">Closed observations</a></li><li><a href="#bounds">Bounds and checking</a></li><li><a href="#evidence">Evidence limits</a></li></ul></nav><section id="scope"><h2>Scope</h2><p>JSON operation <code>run-http-policy-client</code>, exact version <code>0.1.0-draft.24</code>. The adapter calls the production ExecutionClient and HttpExecutionTransport with controlled Fetch effects and the real compiled functional cursor. It does not call a fake parallel client or use a native descriptor. Every captured request records actual method, HTTP path, status and parsed body.</p><p>The <a href="../mck/draft.24/cases.json">26 fixed cases</a> and expected projections are parent-owned and authored before production adapter execution. Source fixtures reuse independent capability-execution fixtures where applicable. No case ID or expectation is sent to the adapter.</p></section><section id="input"><h2>Closed inputs</h2><p>The exact input has sessionId, evaluation, invocations and actions. Evaluation has model, entry, inputs, runtime, providerId and optional admission selection. The fixture runtime and provider must agree with the initial offered Scheme provider. Invocation has id, path session/submit/query/cancel/release, status, source and held. Null source throws a transport loss. Held replies remain pending until a deliver action references that unique invocation. Actions initialize/evaluate/resume/cancel/release have id; deliver has call; mutate has replacement evaluation; authenticate has nullable sessionId. Authentication action changes the injected real-client reauthentication callback and emits no request. Each action drains microtasks to quiescence. An async no-op pause permits finite scripted poll responses; held replies explicitly gate pending work.</p><p>All fixture action syntax is validated before execution. Unknown operations or infrastructure members reject. Source text and opaque HTTP bodies remain implementation input, even when deliberately malformed.</p></section><section id="projection"><h2>Closed observations</h2><p>The exact projection has steps, requests, acceptedPlans. Each cumulative step records action, active, polling, releasePending, uncertainSubmission, suspended, execution summary and ordered attempt inventory. Attempt has id, status pending/returned/rejected, success nullable boolean, submissionUnknown and executionTransport. Initialize boolean results map to success; evaluation maps result.success; void maps null. Execution summary has state, sequence, cancelRequested and connected. Requests record actual GET/POST method, /api/workbench path, status null until delivery or loss, and null or a closed parsed host body. Accepted plans come from the actual trusted acceptance observer. A returned plan or caller request cannot replace retained client context.</p></section><section id="bounds"><h2>Bounds and checking</h2><p>Existing shared framing limits apply: compact input and projection at most1MiB, corpus16MiB and1024cases, aggregate observations16MiB, report32MiB. Client/provider actions are at most32 and requests128. Fixed traces retain at most four accepted plans. Identity, plan and diagnostic limits retain UTF-16 semantics after schema code-point checks. Provider plan/receipt identities must agree, accepted owner-scoped execution and plan IDs cannot repeat, terminal values must be canonical, and observed worker exits cannot exceed starts.</p><p>One shared Rust runner performs capability negotiation, fixture validation, bounded observation validation and comparison. Independent saved-report checking recomputes the exact corpus SHA-256, ordered case inventory, capabilities, verdicts and qualification. Replaying expected responses proves checker infrastructure only.</p><pre><code class="language-bash">morphir mck workbench run --kit spec/workbench/mck/draft.24 --adapter /path/to/adapter --report report.json
morphir mck workbench check --kit spec/workbench/mck/draft.24 --report report.json</code></pre></section><section id="evidence"><h2>Evidence limits</h2><p>Controlled client effects do not establish authentication or actual execution. Actual provider traces identify the gateway, worker and provider used, and retain the selected runtime's bounds. Live browser, packaged Proton, physical transport fault and supported daemon regression checks need separate receipts. Frozen HTTP host draft.1, native mappings, execution receipts and earlier MCK14–22 remain separately qualified. Native compilation never enables a connected execution policy offer.</p></section></main></body></html>
