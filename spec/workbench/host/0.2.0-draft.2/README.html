<section id="scope"><h2>Scope and negotiation</h2>
<p>This exact HTTP mapping adds checking-policy negotiation to the frozen <a href="../0.2.0-draft.1/README.md">host draft.1</a>. The descriptor has exactly <code>profile</code>, <code>contractVersion</code>, <code>offer</code>, <code>capabilityChecks</code>. Its profile is <code>morphir/workbench/host</code> and version is <code>0.2.0-draft.2</code>. The offer retains the exact <code>morphir/workbench/executions</code> <code>0.2.0-draft.1</code> identity and operation contract.</p>
<p>The checking offer has exactly profile <code>morphir/workbench/admission</code>, contractVersion <code>0.1.0-draft.1</code>, runtime <code>scheme</code>, evaluator <code>scheme-portable-v1/shared-sdk/bounded</code>, and policies <code>[&quot;strict&quot;,&quot;permissive&quot;]</code> in that order. The admission spelling is a frozen wire identifier. User-facing documentation and controls use capability checking.</p>
<p>Unknown profiles, prereleases, build suffixes, runtimes, evaluators, policies and members reject. A descriptor is received through an authenticated HTTP session. Compilation capability, a native MEP offer, a Rust protocol v1 descriptor with executions disabled, or an unauthenticated body cannot create this offer. Strict-only providers continue to publish their qualified draft.1 mapping. Explicit permissive requests never fall back to strict, another provider, another runtime or a local evaluator.</p></section>
<section id="submission"><h2>Immutable submission</h2>
<p>The exact draft.2 request has required <code>contractVersion</code>, <code>model</code>, <code>entry</code>, <code>inputs</code>, <code>runtime</code>, <code>providerId</code>, and optional <code>admission</code>. Runtime must be Scheme and providerId must equal the negotiated provider. Inputs have exactly format <code>json</code> or <code>ion-text</code> and source text. No paths, caller manifests, caller plan IDs or accepted boundaries are allowed.</p>
<p>Omitting the selection resolves once to strict. Explicit selection has exactly the frozen capability-policy profile, version and policy. The client copies source, entry, arguments and selection synchronously before any await. The authenticated host validates request framing, authority, decoding, complete selected public boundary and arguments before accepting. Strict checks the model according to its existing rules. Permissive permits unreachable unsupported code while keeping all mandatory model, type, argument and resource checks. Reached unsupported code remains a terminal evaluation failure.</p>
<p>The initial reply has exactly <code>identity</code>, <code>calls</code>, <code>receipt</code>, <code>plan</code>. Calls is exactly <code>[&quot;workbench&quot;]</code>. Receipt is the unchanged initial executions draft.1 receipt. Plan is the <a href="../../execution-plan/0.2.0-draft.1/README.md">execution-plan draft.1</a> projection. All identity fields must agree with the negotiated authority and with each other. Runtime, evaluator, policy and selected boundary must agree with the captured submission. The client rejects rebinding or reuse of an accepted authority-scoped execution or plan ID, even with a new snapshot ID.</p></section>
<section id="authority"><h2>Authentication and authority</h2>
<p>Authentication is a transport responsibility, separate from descriptor shape. The gateway checks the current authenticated session and selected provider for every operation. A rejected or expired credential cannot mutate an execution. A changed host, session, provider, operation inventory or checking offer cannot replace the selection of an accepted execution. Authentication secrets are never included in execution plans, receipts or compatibility projections.</p>
<p>The provider retains the accepted plan and immutable input snapshot. A worker claims that exact retained selection once. A claim checks owner authority, execution/plan identity, runtime, policy and provider. A second exact claim rejects. A mismatched claim rejects without consuming the valid claim. Workers use the real selected Scheme evaluator, echo the retained plan and publish typed outcomes through the host's captured-context validator after confirmed completion. No supplied terminal or proxy response establishes actual execution.</p></section>
<section id="lifecycle"><h2>Execution lifecycle</h2>
<p>Query, cancellation, release, their bodies and receipts remain the frozen host draft.1 forms. Query never re-executes. Cancellation acknowledgement is separate from terminal cancellation and may race with a value or failure. Release follows confirmed terminal completion; cleanup failure remains separate from the primary terminal outcome.</p>
<p>A lost submit reply leaves submission uncertain. The client cannot safely retry, silently submit elsewhere or manufacture an identity. A lost query reply preserves the accepted cursor and selection. Same-authority reconnection can query the same execution without a new claim. A changed offer or expired authentication preserves retained evidence and cannot fabricate success, cancellation or cleanup. Release and shutdown retain once-only execution semantics, including after a lost reply.</p></section>
<section id="bounds"><h2>Bounds and validation</h2>
<table><thead><tr><th>Item</th><th>Bound</th></tr></thead><tbody><tr><td>UTF-8 request and reply frames</td><td>1 MiB before parsing, source decoding or state mutation</td></tr><tr><td>Source and arguments</td><td>Existing host and selected Scheme decoder limits; source is opaque to schema and runner</td></tr><tr><td>Identity and plan IDs</td><td>1–128 UTF-16 code units</td></tr><tr><td>Entry</td><td>1–1024 UTF-16 code units and existing selected entry rules</td></tr><tr><td>Revision</td><td>Integer 0–2147483647</td></tr><tr><td>Client accepted identity history</td><td>At most 256 per session; capacity checked before submission effects</td></tr></tbody></table>
<p>Reject malformed UTF-8, duplicate JSON members, extra members, retired job aliases and over-budget whole frames. UTF-8 limits include leading whitespace before normalization. Schema code-point bounds do not replace UTF-16 semantic bounds. Reserve the complete initial reply before owner publication. A refusal must leave accepted identity allocation, worker claims and provider execution unchanged.</p></section>
<section id="evidence"><h2>Independent evidence</h2>
<p>Shared Rust MCK owns exact fixed inputs and expectations. Boundary checks qualify production decoders, controlled client traces qualify production request capture and state transitions, and provider traces qualify the real owner/evaluator. Controlled fixtures alone establish no authentication, network, worker isolation or packaged platform claim.</p>
<p>Actual authenticated gateway requests, selected Node worker logs, typed terminal publication, browser workflows and packaged Proton workflows require separate receipts. Those receipts identify the actual gateway/provider and platform. They establish no production Rust v1 daemon policy support, generated browser backend capability or unevidenced operating system support. Frozen host draft.1, native drafts.1 and .2, executions and all earlier MCK kits remain separately qualified.</p></section>
