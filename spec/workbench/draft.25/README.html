  start from this file: copy it, keep the <head> and the CSS as they are, and write the content inside <main><h1>Authenticated HTTP checking-policy provider qualification</h1><p class="meta">Exact Workbench MCK 0.1.0-draft.25</p><nav class="toc" aria-label="Contents"><ul><li><a href="#scope">Scope</a></li><li><a href="#input">Closed inputs</a></li><li><a href="#projection">Closed observations</a></li><li><a href="#bounds">Bounds and checking</a></li><li><a href="#evidence">Evidence limits</a></li></ul></nav><section id="scope"><h2>Scope</h2><p>JSON operation <code>run-http-policy-provider</code>, exact version <code>0.1.0-draft.25</code>. The adapter performs real loopback HTTP requests through the production gateway, production provider, actual Node workers and selected Scheme evaluator. The upstream authentication endpoint is a controlled dependency. Claims about a production Rust daemon, another provider, another runtime or packaged platform do not follow.</p><p>The <a href="../mck/draft.25/cases.json">22 fixed cases</a> and expected projections are parent-owned and authored before production adapter execution. Source fixtures reuse independent capability-execution fixtures where applicable. No case ID or expectation is sent to the adapter.</p></section><section id="input"><h2>Closed inputs</h2><p>The exact input has opaque submission and closed actions. Initial authentication role is session. Actions session, submit, submit-lost-reply and shutdown have no other fields. Wait, query, cancel, release, query-lost-reply and release-lost-reply have a zero-based execution index 0–3. Authenticate has nullable sessionId and changes the controlled upstream endpoint. Replace-submission has opaque submission and only changes the caller fixture for future submits. At most four submit attempts occur. A literal providerId equal to provider resolves once to the actual provider ID returned by the first descriptor. Other provider IDs remain untouched. No version, policy, runtime or source rewriting is allowed.</p><p>All fixture action syntax is validated before execution. Unknown operations or infrastructure members reject. Source text and opaque HTTP bodies remain implementation input, even when deliberately malformed.</p></section><section id="projection"><h2>Closed observations</h2><p>The projection has requests, executions, workers and nullable infrastructure failure. Request summaries record operation, actual HTTP status, bounded error code or null, and addressed execution index or null. Wait performs actual queries until a terminal receipt and emits one final wait summary. Lost-reply operations invoke the real operation then physically discard response delivery; their summary has status:null and code:null. A trusted observer can retain the actual accepted plan and receipt after delivery loss. This is instrumentation, not recovered client knowledge or a claim of a physical network fault. Executions retain actual plan, last observed receipt and release success. Actual host/provider/initial session IDs normalize to fixture roles host/provider/session, and accepted execution/snapshot/plan identities normalize by acceptance order, preserving relationships. Changed authority is never normalized back to the original role. Workers record actual started/exited counts and policies read from actual posted selected requests. No predicted transition substitutes for observation. Shutdown produces no HTTP summary and preserves the last observed execution receipt.</p></section><section id="bounds"><h2>Bounds and checking</h2><p>Existing shared framing limits apply: compact input and projection at most1MiB, corpus16MiB and1024cases, aggregate observations16MiB, report32MiB. Client/provider actions are at most32 and requests128. Fixed traces retain at most four accepted plans. Identity, plan and diagnostic limits retain UTF-16 semantics after schema code-point checks. Provider plan/receipt identities must agree, accepted owner-scoped execution and plan IDs cannot repeat, terminal values must be canonical, and observed worker exits cannot exceed starts.</p><p>One shared Rust runner performs capability negotiation, fixture validation, bounded observation validation and comparison. Independent saved-report checking recomputes the exact corpus SHA-256, ordered case inventory, capabilities, verdicts and qualification. Replaying expected responses proves checker infrastructure only.</p><pre><code class="language-bash">morphir mck workbench run --kit spec/workbench/mck/draft.25 --adapter /path/to/adapter --report report.json
morphir mck workbench check --kit spec/workbench/mck/draft.25 --report report.json</code></pre></section><section id="evidence"><h2>Evidence limits</h2><p>Controlled client effects do not establish authentication or actual execution. Actual provider traces identify the gateway, worker and provider used, and retain the selected runtime's bounds. Live browser, packaged Proton, physical transport fault and supported daemon regression checks need separate receipts. Frozen HTTP host draft.1, native mappings, execution receipts and earlier MCK14–22 remain separately qualified. Native compilation never enables a connected execution policy offer.</p></section></main></body></html>
