<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 646" role="img" aria-labelledby="title description">
<title id="title">Reference lookup measurements on Windows ARM64</title>
<desc id="description">Two grouped bar charts. The first compares decoded source bytes for a full scan and verified index over 64 sweeps. The second compares raw source and index sizes. Exact counts appear beside the bars and in the results table.</desc>
<rect width="960" height="646" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" fill="#172334">
<text x="26" y="35" font-size="22" font-weight="700">Reference lookup measurements</text>
<text x="26" y="76" font-size="16" font-weight="700">Source bytes decoded across 64 warm sweeps</text>
<rect x="190" y="90" width="12" height="12" fill="#345f9c"/><text x="209" y="99" font-size="12">Full scan</text>
<rect x="350" y="90" width="12" height="12" fill="#128061"/><text x="369" y="99" font-size="12">Verified index</text>
<line x1="190" x2="190" y1="114" y2="281" stroke="#d9e1ea"/><text x="190" y="299" text-anchor="middle" font-size="11">0</text>
<line x1="352" x2="352" y1="114" y2="281" stroke="#d9e1ea"/><text x="352" y="299" text-anchor="middle" font-size="11">60,000</text>
<line x1="515" x2="515" y1="114" y2="281" stroke="#d9e1ea"/><text x="515" y="299" text-anchor="middle" font-size="11">120,000</text>
<line x1="678" x2="678" y1="114" y2="281" stroke="#d9e1ea"/><text x="678" y="299" text-anchor="middle" font-size="11">180,000</text>
<line x1="840" x2="840" y1="114" y2="281" stroke="#d9e1ea"/><text x="840" y="299" text-anchor="middle" font-size="11">240,000</text>
<text x="173" y="137" text-anchor="end" font-size="13">Contextual</text>
<rect x="190" y="120" width="617" height="11" fill="#345f9c"/><text x="813" y="130" font-size="11">227,840</text>
<rect x="190" y="135" width="17" height="11" fill="#128061"/><text x="213" y="145" font-size="11">6,272</text>
<text x="173" y="177" text-anchor="end" font-size="13">Context last</text>
<rect x="190" y="160" width="617" height="11" fill="#345f9c"/><text x="813" y="170" font-size="11">227,840</text>
<rect x="190" y="175" width="17" height="11" fill="#128061"/><text x="213" y="185" font-size="11">6,272</text>
<text x="173" y="217" text-anchor="end" font-size="13">Reordered</text>
<rect x="190" y="200" width="614" height="11" fill="#345f9c"/><text x="810" y="210" font-size="11">226,560</text>
<rect x="190" y="215" width="17" height="11" fill="#128061"/><text x="213" y="225" font-size="11">6,272</text>
<text x="173" y="257" text-anchor="end" font-size="13">Expanded</text>
<rect x="190" y="240" width="480" height="11" fill="#345f9c"/><text x="676" y="250" font-size="11">177,152</text>
<rect x="190" y="255" width="21" height="11" fill="#128061"/><text x="217" y="265" font-size="11">7,680</text>
<text x="26" y="356" font-size="16" font-weight="700">Serialized size in bytes</text>
<rect x="190" y="370" width="12" height="12" fill="#345f9c"/><text x="209" y="379" font-size="12">Source documents</text>
<rect x="350" y="370" width="12" height="12" fill="#128061"/><text x="369" y="379" font-size="12">Index</text>
<line x1="190" x2="190" y1="394" y2="561" stroke="#d9e1ea"/><text x="190" y="579" text-anchor="middle" font-size="11">0</text>
<line x1="352" x2="352" y1="394" y2="561" stroke="#d9e1ea"/><text x="352" y="579" text-anchor="middle" font-size="11">300</text>
<line x1="515" x2="515" y1="394" y2="561" stroke="#d9e1ea"/><text x="515" y="579" text-anchor="middle" font-size="11">600</text>
<line x1="678" x2="678" y1="394" y2="561" stroke="#d9e1ea"/><text x="678" y="579" text-anchor="middle" font-size="11">900</text>
<line x1="840" x2="840" y1="394" y2="561" stroke="#d9e1ea"/><text x="840" y="579" text-anchor="middle" font-size="11">1,200</text>
<text x="173" y="417" text-anchor="end" font-size="13">Contextual</text>
<rect x="190" y="400" width="482" height="11" fill="#345f9c"/><text x="678" y="410" font-size="11">890</text>
<rect x="190" y="415" width="565" height="11" fill="#128061"/><text x="761" y="425" font-size="11">1,043</text>
<text x="173" y="457" text-anchor="end" font-size="13">Context last</text>
<rect x="190" y="440" width="482" height="11" fill="#345f9c"/><text x="678" y="450" font-size="11">890</text>
<rect x="190" y="455" width="565" height="11" fill="#128061"/><text x="761" y="465" font-size="11">1,043</text>
<text x="173" y="497" text-anchor="end" font-size="13">Reordered</text>
<rect x="190" y="480" width="479" height="11" fill="#345f9c"/><text x="675" y="490" font-size="11">885</text>
<rect x="190" y="495" width="564" height="11" fill="#128061"/><text x="760" y="505" font-size="11">1,041</text>
<text x="173" y="537" text-anchor="end" font-size="13">Expanded</text>
<rect x="190" y="520" width="375" height="11" fill="#345f9c"/><text x="571" y="530" font-size="11">692</text>
<rect x="190" y="535" width="529" height="11" fill="#128061"/><text x="725" y="545" font-size="11">977</text>
</g></svg>
